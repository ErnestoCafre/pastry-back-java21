name: Wake Render (manual)

# Despertar a mano el web service Free de Render antes de mostrar la demo.
#
# Este workflow ya no corre por cron. El schedule cada 10 min se midio sobre
# 934 runs (17/07/2026 - 10/10/2026) y no servia para mantener despierto el
# servicio:
#   - GitHub demora los schedules bajo carga: mediana de 63 min entre runs,
#     p90 de 6 h. Solo 10 de 933 intervalos quedaron por debajo de los 15 min
#     que tarda Render en dormir el servicio.
#   - En un repo publico GitHub desactiva los schedules tras 60 dias sin
#     actividad. Paso el 10/10/2026 y nada aviso.
# El keep-alive periodico lo hace un monitor externo (ver scripts/README.md).

on:
  workflow_dispatch:

concurrency:
  group: keep-alive
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    # El peor caso del script son 300s (3 intentos de 90s + 2 esperas de 15s).
    # Este timeout debe quedar por encima de eso o el job muere a mitad del reintento.
    timeout-minutes: 8
    steps:
      # v5 declara node24; v4 declaraba node20, que GitHub retiro de los runners
      # el 23/09/2026.
      - uses: actions/checkout@v5

      - name: Ping al servicio
        env:
          KEEPALIVE_URL: https://malva-pastry-backend.onrender.com/login
        run: |
          chmod +x scripts/keep-alive.sh
          # Es un despertar manual: ignora la ventana horaria.
          scripts/keep-alive.sh --force
