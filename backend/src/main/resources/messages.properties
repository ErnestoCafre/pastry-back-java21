# Copy del panel.
#
# Solo entra acá el texto que se escribía en más de un lugar, o el que forma
# una familia que tiene que sonar igual. Un texto que aparece una vez y solo
# en su plantilla se lee mejor donde está; centralizarlo por costumbre agrega
# una indirección y no evita nada.
#
# El archivo es UTF-8: Spring Boot lee messages.properties con esa codificación
# desde 2.x, así que los acentos van escritos, no como \uXXXX.

# ---------------------------------------------------------------------------
# Confirmaciones
#
# Son la razón de que este archivo exista. El diagnóstico inicial encontró 15
# redacciones distintas -mezclando "¿Estas seguro...?" sin tilde, "¿Eliminar
# X?" y variantes- para 14 pares (acción, entidad).
#
# La de más es el caso que justifica la regla: el borrado de tag se confirmaba
# en tags/list.html y otra vez en tags/show.html, y para cuando se midió las
# dos copias ya habían divergido -"¿Eliminar este tag? Se moverá a la
# papelera." contra "¿Estas seguro de eliminar este tag? Se movera a la
# papelera."-. Ninguna de las dos falla sola; separarse es todo lo que hacen.
#
# Tres familias entonces, y la diferencia entre ellas es deliberada:
#   delete      -> reversible, va a la papelera. Lo dice.
#   hardDelete  -> irreversible. Lo dice más fuerte.
#   remove      -> no destruye nada, solo desasocia. No asusta.
#
# disable es una cuarta, pero no salió del diagnóstico: no se confirmaba en
# ningún lado. Está más abajo, con su propio motivo.
# ---------------------------------------------------------------------------

confirm.delete.category=¿Eliminar esta categoría? Se moverá a la papelera.
confirm.delete.ingredient=¿Eliminar este ingrediente? Se moverá a la papelera.
confirm.delete.product=¿Eliminar este producto? Se moverá a la papelera.
confirm.delete.section=¿Eliminar esta sección? Se moverá a la papelera.
confirm.delete.tag=¿Eliminar este tag? Se moverá a la papelera.

confirm.hardDelete.category=¿Eliminar PERMANENTEMENTE esta categoría? Esta acción no se puede deshacer.
confirm.hardDelete.ingredient=¿Eliminar PERMANENTEMENTE este ingrediente? Esta acción no se puede deshacer.
confirm.hardDelete.product=¿Eliminar PERMANENTEMENTE este producto? Esta acción no se puede deshacer.
confirm.hardDelete.section=¿Eliminar PERMANENTEMENTE esta sección? Esta acción no se puede deshacer.
confirm.hardDelete.tag=¿Eliminar PERMANENTEMENTE este tag? Esta acción no se puede deshacer.

confirm.remove.ingredientFromRecipe=¿Quitar este ingrediente de la receta?
confirm.remove.productFromSection=¿Quitar este producto de la sección?
confirm.remove.productFromTag=¿Quitar este producto del tag?
confirm.remove.tagFromProduct=¿Quitar este tag del producto?

# Desactivar no borra, pero deja a alguien afuera del panel: confirma, y dice
# exactamente qué pasa en vez de preguntar si estás seguro.
confirm.disable.user=¿Desactivar este usuario? No va a poder iniciar sesión.

# ---------------------------------------------------------------------------
# Ausencias
#
# Lo que se muestra cuando un campo opcional está vacío. Cada uno estaba
# escrito en 3 a 6 plantillas.
# ---------------------------------------------------------------------------

empty.category=Sin categoría
empty.description=Sin descripción
empty.price=Sin precio
empty.results=Sin resultados

# El usuario que no se conoce: quién borró algo en las papeleras y quién creó
# un producto en su ficha. Estaba escrito a mano en los seis lugares.
empty.user=Desconocido

# displayOrder sin valor. La ficha decía "Sin orden" y el listado "—".
empty.order=Sin orden
