<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/main}">

<!--/*
  Este listado es el que motivó partir form :: search en el paso previo.

  Tiene TRES filtros —producto, desde y hasta— que viajan en un mismo
  formulario, y la versión anterior del fragment traía su propio <form>. Los
  formularios no se anidan, así que era imposible usarlo acá. Ahora los campos
  vienen sueltos y el <form> lo pone esta plantilla.

  Los tres <label> tampoco tenían `for`, así que ningún lector de pantalla los
  asociaba a su campo; form :: filterField los asocia por construcción.

  Acción de fila: solo Ver. Es la excepción al modelo Ver/Editar/Borrar del
  resto del panel, y es deliberada: una venta es un asiento histórico. No se
  edita ni se borra, porque la fila guarda el precio y el nombre del producto
  tal como estaban al vender, y reescribirlos falsearía la historia.
*/-->

<head>
    <title th:text="${pageTitle}">Ventas</title>
</head>

<body>
    <div layout:fragment="content"
         th:with="filtered=${!#strings.isEmpty(search) or startDate != null or endDate != null}">

        <th:block th:replace="~{fragments/alerts :: flash(${success}, ${error})}"></th:block>

        <div class="mb-6 flex flex-col gap-4 lg:flex-row lg:items-end lg:justify-between">
            <form th:action="@{/sales}" method="get" class="flex flex-1 flex-wrap items-end gap-3">
                <div class="min-w-[200px] flex-1">
                    <div th:replace="~{fragments/form :: filterField(
                            'search', 'search', 'Producto', 'text', ${search}, 'Buscar por producto...')}"></div>
                </div>
                <div th:replace="~{fragments/form :: filterField(
                        'startDate', 'startDate', 'Desde', 'date', ${startDate}, null)}"></div>
                <div th:replace="~{fragments/form :: filterField(
                        'endDate', 'endDate', 'Hasta', 'date', ${endDate}, null)}"></div>

                <div class="flex items-center gap-2">
                    <button th:replace="~{fragments/buttons :: submit('Filtrar', 'primary')}"></button>
                    <a th:replace="~{fragments/buttons :: link('/sales', 'Limpiar', null, 'secondary')}"></a>
                </div>
            </form>

            <a th:replace="~{fragments/buttons :: link('/sales/new', 'Nueva Venta', 'plus', 'primary')}"></a>
        </div>

        <div th:if="${!sales.content.empty}" class="mb-6 grid grid-cols-1 gap-4 sm:grid-cols-2">
            <div class="flex items-center gap-3 rounded-xl border border-gray-200 bg-white p-4 shadow-sm">
                <span class="text-2xl" aria-hidden="true">🛒</span>
                <div>
                    <div class="text-xl font-bold text-gray-800" th:text="${sales.totalElements}">0</div>
                    <div class="text-sm text-gray-500">Ventas encontradas</div>
                </div>
            </div>
            <div class="flex items-center gap-3 rounded-xl border border-gray-200 bg-white p-4 shadow-sm">
                <span class="text-2xl" aria-hidden="true">💰</span>
                <div>
                    <div class="text-xl font-bold text-green-600"
                         th:text="${@money.format(totalSalesAmount)}">$0,00</div>
                    <div class="text-sm text-gray-500">Ingreso total del filtro</div>
                </div>
            </div>
        </div>

        <div class="overflow-hidden rounded-xl border border-gray-200 bg-white shadow-sm">
            <div class="overflow-x-auto">
                <table class="min-w-full divide-y divide-gray-200">
                    <caption class="sr-only">Listado de ventas registradas</caption>
                    <thead class="bg-gray-50">
                        <tr>
                            <th th:replace="~{fragments/table :: th('ID')}"></th>
                            <th th:replace="~{fragments/table :: th('Fecha')}"></th>
                            <th th:replace="~{fragments/table :: th('Producto')}"></th>
                            <th th:replace="~{fragments/table :: th('Cliente')}"></th>
                            <th th:replace="~{fragments/table :: thCenter('Cantidad')}"></th>
                            <th th:replace="~{fragments/table :: th('Precio Unit.')}"></th>
                            <th th:replace="~{fragments/table :: th('Total')}"></th>
                            <th th:replace="~{fragments/table :: thRight('Acciones')}"></th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-gray-200 bg-white">
                        <tr th:each="sale : ${sales.content}" class="hover:bg-gray-50">
                            <td class="whitespace-nowrap px-6 py-4">
                                <a th:href="@{/sales/{id}(id=${sale.id})}"
                                   class="text-sm font-medium text-gray-900 transition-colors hover:text-primary-600"
                                   th:text="'#' + ${sale.id}"></a>
                            </td>
                            <td class="whitespace-nowrap px-6 py-4">
                                <div class="text-sm text-gray-900"
                                     th:text="${@dates.format(sale.saleDate)}"></div>
                            </td>
                            <td class="whitespace-nowrap px-6 py-4">
                                <div class="font-medium text-gray-900" th:text="${sale.productName}"></div>
                            </td>
                            <td class="whitespace-nowrap px-6 py-4">
                                <div class="text-sm text-gray-900" th:text="${sale.customerName} ?: '—'"></div>
                            </td>
                            <td class="whitespace-nowrap px-6 py-4 text-center">
                                <div class="text-sm text-gray-900" th:text="${sale.quantity}"></div>
                            </td>
                            <td class="whitespace-nowrap px-6 py-4">
                                <div class="text-sm text-gray-900" th:text="${@money.format(sale.unitPrice)}"></div>
                            </td>
                            <td class="whitespace-nowrap px-6 py-4">
                                <div class="text-sm font-semibold text-green-600"
                                     th:text="${@money.format(sale.totalAmount)}"></div>
                            </td>
                            <td class="whitespace-nowrap px-6 py-4 text-right text-sm">
                                <div class="flex items-center justify-end gap-1">
                                    <a th:replace="~{fragments/buttons :: iconLink(
                                            '/sales/' + ${sale.id}, 'eye', 'Ver detalle de la venta', 'neutral')}"></a>
                                </div>
                            </td>
                        </tr>

                        <tr th:replace="~{fragments/table :: emptyRow(${sales.content}, 8, 'cart',
                                ${filtered} ? #{empty.results} : 'No hay ventas registradas',
                                'Las ventas registradas acá alimentan los totales del panel.',
                                '/sales/new', 'Registrar primera venta',
                                ${filtered} ? '/sales' : null)}"></tr>
                    </tbody>
                </table>
            </div>

            <div th:replace="~{fragments/pagination :: bar(${sales}, '/sales', 'ventas',
                    ${ {'search': search, 'startDate': startDate, 'endDate': endDate} })}"></div>
        </div>
    </div>
</body>

</html>
