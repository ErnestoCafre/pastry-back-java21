<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/main}">

<!--/*
  Ficha de ingrediente. El "Volver" del pie salió: la miga ya es el camino de
  vuelta (ver categories/show).

  El borrado solo aparece si el ingrediente no está en uso, y cuando lo está se
  explica por qué no se puede. Eso ya estaba y se conserva: es una regla de
  negocio, no una inconsistencia.

  Acentos: el aviso decía "esta en uso" y la confirmación "¿Estas seguro...?".
*/-->

<head>
    <title th:text="${pageTitle}">Detalle del Ingrediente</title>
</head>

<body>
    <div layout:fragment="content">

        <th:block th:replace="~{fragments/alerts :: flash(${success}, ${error})}"></th:block>

        <nav th:replace="~{fragments/breadcrumb :: trail('Ingredientes', '/ingredients', ${ingredient.name})}"></nav>

        <div class="max-w-2xl overflow-hidden rounded-xl border border-gray-200 bg-white shadow-sm">
            <div class="p-6">
                <div class="mb-6 flex items-start justify-between gap-4">
                    <div>
                        <h2 class="text-2xl font-bold text-gray-900" th:text="${ingredient.name}"></h2>
                        <p th:if="${ingredient.description}" class="mt-1 text-gray-500"
                           th:text="${ingredient.description}"></p>
                    </div>
                    <span class="flex-shrink-0 rounded-full bg-blue-100 px-3 py-1 text-sm font-medium text-blue-800"
                          th:text="${ingredient.unitOfMeasure.displayName}"></span>
                </div>

                <dl class="grid grid-cols-1 gap-4 sm:grid-cols-2">
                    <div class="rounded-lg bg-gray-50 px-4 py-3">
                        <dt class="text-sm font-medium text-gray-500">Costo Unitario</dt>
                        <dd class="mt-1 text-lg font-semibold text-gray-900"
                            th:text="${@money.format(ingredient.unitCost)}"></dd>
                    </div>
                    <div class="rounded-lg bg-gray-50 px-4 py-3">
                        <dt class="text-sm font-medium text-gray-500">Unidad de Medida</dt>
                        <dd class="mt-1 text-lg font-semibold text-gray-900"
                            th:text="${ingredient.unitOfMeasure.toString()}"></dd>
                    </div>
                    <div class="rounded-lg bg-gray-50 px-4 py-3">
                        <dt class="text-sm font-medium text-gray-500">Usado en productos</dt>
                        <dd class="mt-1 text-lg font-semibold text-gray-900" th:text="${usageCount}"></dd>
                    </div>
                    <div class="rounded-lg bg-gray-50 px-4 py-3">
                        <dt class="text-sm font-medium text-gray-500">Fecha de registro</dt>
                        <dd class="mt-1 text-lg font-semibold text-gray-900"
                            th:text="${#temporals.format(ingredient.insertedAt, 'dd/MM/yyyy')}"></dd>
                    </div>
                </dl>
            </div>

            <div class="flex items-center justify-end gap-3 border-t border-gray-200 bg-gray-50 px-6 py-4">
                <span th:if="${usageCount > 0}" class="mr-auto text-sm text-gray-500">
                    No se puede eliminar porque está en uso
                </span>
                <a th:replace="~{fragments/buttons :: link(
                        '/ingredients/' + ${ingredient.id} + '/edit', 'Editar', 'pencil', 'primary')}"></a>
                <th:block th:if="${usageCount == 0}">
                    <form th:replace="~{fragments/buttons :: action(
                            '/ingredients/' + ${ingredient.id} + '/delete',
                            '¿Eliminar este ingrediente? Se moverá a la papelera.',
                            'Eliminar', 'trash', 'danger')}"></form>
                </th:block>
            </div>
        </div>
    </div>
</body>

</html>
