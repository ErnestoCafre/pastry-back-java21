<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/main}">

<!--/*
  Papelera de ingredientes. Ver categories/deleted para el patrón.

  Las columnas conservan el orden y el título del listado activo —Nombre,
  Descripción, Costo Unitario, Unidad— y recién después vienen Eliminado,
  Eliminado por y Acciones. Antes esta tabla arrancaba Nombre, Unidad, Costo y
  metía la descripción debajo del nombre, así que las mismas cuatro columnas
  estaban en otro lugar según desde qué pantalla llegaras, y "Costo Unitario"
  se llamaba "Costo".
*/-->

<head>
    <title th:text="${pageTitle}">Ingredientes eliminados</title>
</head>

<body>
    <div layout:fragment="content">

        <th:block th:replace="~{fragments/alerts :: flash(${success}, ${error})}"></th:block>

        <div th:replace="~{fragments/breadcrumb :: back('Volver a Ingredientes', '/ingredients')}"></div>

        <div class="overflow-hidden rounded-xl border border-gray-200 bg-white shadow-sm">
            <div class="overflow-x-auto">
                <table class="min-w-full divide-y divide-gray-200">
                    <caption class="sr-only">Ingredientes en la papelera</caption>
                    <thead class="bg-gray-50">
                        <tr>
                            <th th:replace="~{fragments/table :: thLeft('Nombre')}"></th>
                            <th th:replace="~{fragments/table :: thLeft('Descripción')}"></th>
                            <th th:replace="~{fragments/table :: thRight('Costo Unitario')}"></th>
                            <th th:replace="~{fragments/table :: thLeft('Unidad')}"></th>
                            <th th:replace="~{fragments/table :: thLeft('Eliminado')}"></th>
                            <th th:replace="~{fragments/table :: thLeft('Eliminado por')}"></th>
                            <th th:replace="~{fragments/table :: thRight('Acciones')}"></th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-gray-200 bg-white">
                        <tr th:each="ingredient : ${ingredients.content}" class="hover:bg-gray-50">
                            <td class="whitespace-nowrap px-6 py-4">
                                <div class="font-medium text-gray-900" th:text="${ingredient.name}"></div>
                            </td>
                            <td class="px-6 py-4">
                                <div class="max-w-xs truncate">
                                    <span th:if="${ingredient.description != null}" class="text-sm text-gray-500"
                                          th:text="${ingredient.description}"></span>
                                    <!--/* El th:unless va en un envoltorio y NO junto al
                                           th:replace: juntos, la condicion no se evalua. */-->
                                    <th:block th:unless="${ingredient.description != null}">
                                        <span th:replace="~{fragments/table :: muted(#{empty.description})}"></span>
                                    </th:block>
                                </div>
                            </td>
                            <td class="whitespace-nowrap px-6 py-4 text-right text-sm text-gray-900"
                                th:text="${@money.format(ingredient.unitCost)}"></td>
                            <td class="whitespace-nowrap px-6 py-4">
                                <span class="rounded-full bg-blue-100 px-2 py-1 text-xs font-medium text-blue-800"
                                      th:text="${ingredient.unitOfMeasure.displayName}"></span>
                            </td>
                            <td class="whitespace-nowrap px-6 py-4 text-sm text-gray-500"
                                th:text="${@dates.format(ingredient.deletedAt)}"></td>
                            <td class="whitespace-nowrap px-6 py-4 text-sm text-gray-500"
                                th:text="${ingredient.deletedBy?.fullName} ?: #{empty.user}"></td>
                            <td class="whitespace-nowrap px-6 py-4 text-right">
                                <div class="flex items-center justify-end gap-2">
                                    <form th:replace="~{fragments/buttons :: pill(
                                            '/ingredients/' + ${ingredient.id} + '/restore', null,
                                            'Restaurar', 'restore', 'safe')}"></form>
                                    <form th:replace="~{fragments/buttons :: pill(
                                            '/ingredients/' + ${ingredient.id} + '/hard-delete',
                                            #{confirm.hardDelete.ingredient},
                                            'Eliminar', 'trash', 'danger')}"></form>
                                </div>
                            </td>
                        </tr>

                        <tr th:replace="~{fragments/table :: emptyRow(${ingredients.content}, 7, 'trash',
                                'La papelera está vacía',
                                'Los ingredientes que elimines aparecerán acá y podrás restaurarlos.',
                                null, null, null)}"></tr>
                    </tbody>
                </table>
            </div>

            <div th:replace="~{fragments/pagination :: bar(
                    ${ingredients}, '/ingredients/deleted', 'ingredientes', null)}"></div>
        </div>
    </div>
</body>

</html>
