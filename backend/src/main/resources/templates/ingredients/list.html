<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/main}">

<!--/*
  Acciones de fila: Ver, Editar y Borrar. Antes solo había "Ver".

  Acentos: el encabezado decía "Descripcion" sin tilde.
*/-->

<head>
    <title th:text="${pageTitle}">Ingredientes</title>
</head>

<body>
    <div layout:fragment="content">

        <th:block th:replace="~{fragments/alerts :: flash(${success}, ${error})}"></th:block>

        <div th:replace="~{fragments/toolbar :: listBar(
                '/ingredients', 'Buscar ingredientes...', ${search},
                '/ingredients/deleted', '/ingredients/new', 'Nuevo Ingrediente')}"></div>

        <div class="overflow-hidden rounded-xl border border-gray-200 bg-white shadow-sm">
            <div class="overflow-x-auto">
                <table class="min-w-full divide-y divide-gray-200">
                    <caption class="sr-only">Listado de ingredientes</caption>
                    <thead class="bg-gray-50">
                        <tr>
                            <th th:replace="~{fragments/table :: thLeft('Nombre')}"></th>
                            <th th:replace="~{fragments/table :: thLeft('Descripción')}"></th>
                            <th th:replace="~{fragments/table :: thRight('Costo Unitario')}"></th>
                            <th th:replace="~{fragments/table :: thLeft('Unidad')}"></th>
                            <th th:replace="~{fragments/table :: thRight('Acciones')}"></th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-gray-200 bg-white">
                        <tr th:each="ingredient : ${ingredients.content}" class="hover:bg-gray-50">
                            <td class="whitespace-nowrap px-6 py-4">
                                <a th:href="@{/ingredients/{id}(id=${ingredient.id})}"
                                   class="font-medium text-gray-900 transition-colors hover:text-primary-600"
                                   th:text="${ingredient.name}"></a>
                            </td>
                            <td class="px-6 py-4">
                                <div class="max-w-xs truncate">
                                    <span th:if="${ingredient.description != null}" class="text-sm text-gray-500"
                                          th:text="${ingredient.description}"></span>
                                    <!--/* El th:unless va en un envoltorio y NO junto al
                                           th:replace: juntos, la condicion no se evalua. */-->
                                    <th:block th:unless="${ingredient.description != null}">
                                        <span th:replace="~{fragments/table :: muted(#{empty.description})}"></span>
                                    </th:block>
                                </div>
                            </td>
                            <td class="whitespace-nowrap px-6 py-4 text-right">
                                <span class="text-sm text-gray-900"
                                      th:text="${@money.format(ingredient.unitCost)}"></span>
                            </td>
                            <td class="whitespace-nowrap px-6 py-4">
                                <span class="rounded-full bg-blue-100 px-2 py-1 text-xs font-medium text-blue-800"
                                      th:text="${ingredient.unitOfMeasure.displayName}"></span>
                            </td>
                            <td class="whitespace-nowrap px-6 py-4 text-right text-sm">
                                <div class="flex items-center justify-end gap-1">
                                    <a th:replace="~{fragments/buttons :: iconLink(
                                            '/ingredients/' + ${ingredient.id}, 'eye', 'Ver ingrediente', 'neutral')}"></a>
                                    <a th:replace="~{fragments/buttons :: iconLink(
                                            '/ingredients/' + ${ingredient.id} + '/edit', 'pencil', 'Editar ingrediente', 'edit')}"></a>
                                    <form th:replace="~{fragments/buttons :: iconDelete(
                                            '/ingredients/' + ${ingredient.id} + '/delete',
                                            #{confirm.delete.ingredient},
                                            'Eliminar ingrediente')}"></form>
                                </div>
                            </td>
                        </tr>

                        <tr th:replace="~{fragments/table :: emptyRow(${ingredients.content}, 5, 'beaker',
                                ${#strings.isEmpty(search)} ? 'No hay ingredientes registrados' : #{empty.results},
                                'Los ingredientes son la base de las recetas de cada producto.',
                                '/ingredients/new', 'Crear ingrediente',
                                ${#strings.isEmpty(search)} ? null : '/ingredients')}"></tr>
                    </tbody>
                </table>
            </div>

            <div th:replace="~{fragments/pagination :: bar(
                    ${ingredients}, '/ingredients', 'ingredientes', ${ {'search': search} })}"></div>
        </div>
    </div>
</body>

</html>
