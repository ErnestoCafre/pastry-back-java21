<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/main}">

<!--/*
  Papelera de categorías. Mismo patrón que las otras tres: volver, tabla,
  restaurar / eliminar definitivo, y estado vacío sin CTA (no se "crea" nada en
  una papelera).

  Restaurar no confirma porque es reversible; el borrado permanente sí, y con
  el mismo texto en las cuatro papeleras. Antes cada una lo redactaba distinto.
*/-->

<head>
    <title th:text="${pageTitle}">Categorías eliminadas</title>
</head>

<body>
    <div layout:fragment="content">

        <th:block th:replace="~{fragments/alerts :: flash(${success}, ${error})}"></th:block>

        <div th:replace="~{fragments/breadcrumb :: back('Volver a Categorías', '/categories')}"></div>

        <div class="overflow-hidden rounded-xl border border-gray-200 bg-white shadow-sm">
            <div class="overflow-x-auto">
                <table class="min-w-full divide-y divide-gray-200">
                    <caption class="sr-only">Categorías en la papelera</caption>
                    <thead class="bg-gray-50">
                        <tr>
                            <th th:replace="~{fragments/table :: thLeft('Nombre')}"></th>
                            <th th:replace="~{fragments/table :: thLeft('Descripción')}"></th>
                            <th th:replace="~{fragments/table :: thLeft('Eliminada')}"></th>
                            <th th:replace="~{fragments/table :: thLeft('Eliminada por')}"></th>
                            <th th:replace="~{fragments/table :: thRight('Acciones')}"></th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-gray-200 bg-white">
                        <tr th:each="category : ${categories.content}" class="hover:bg-gray-50">
                            <td class="whitespace-nowrap px-6 py-4">
                                <div class="font-medium text-gray-600" th:text="${category.name}"></div>
                            </td>
                            <td class="px-6 py-4">
                                <div class="max-w-xs truncate">
                                    <span th:if="${category.description != null}" class="text-sm text-gray-500"
                                          th:text="${category.description}"></span>
                                    <!--/* El th:unless va en un envoltorio y NO junto al
                                           th:replace: juntos, la condicion no se evalua. */-->
                                    <th:block th:unless="${category.description != null}">
                                        <span th:replace="~{fragments/table :: muted(#{empty.description})}"></span>
                                    </th:block>
                                </div>
                            </td>
                            <td class="whitespace-nowrap px-6 py-4 text-sm text-gray-500"
                                th:text="${@dates.format(category.deletedAt)}"></td>
                            <td class="whitespace-nowrap px-6 py-4 text-sm text-gray-500"
                                th:text="${category.deletedBy?.fullName} ?: #{empty.user}"></td>
                            <td class="whitespace-nowrap px-6 py-4 text-right">
                                <div class="flex items-center justify-end gap-2">
                                    <form th:replace="~{fragments/buttons :: pill(
                                            '/categories/' + ${category.id} + '/restore', null,
                                            'Restaurar', 'restore', 'safe')}"></form>
                                    <form th:replace="~{fragments/buttons :: pill(
                                            '/categories/' + ${category.id} + '/hard-delete',
                                            #{confirm.hardDelete.category},
                                            'Eliminar', 'trash', 'danger')}"></form>
                                </div>
                            </td>
                        </tr>

                        <tr th:replace="~{fragments/table :: emptyRow(${categories.content}, 5, 'trash',
                                'La papelera está vacía',
                                'Las categorías que elimines aparecerán acá y podrás restaurarlas.',
                                null, null, null)}"></tr>
                    </tbody>
                </table>
            </div>

            <div th:replace="~{fragments/pagination :: bar(
                    ${categories}, '/categories/deleted', 'categorías', null)}"></div>
        </div>
    </div>
</body>

</html>
