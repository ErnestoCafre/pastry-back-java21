<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/main}">

<!--/*
  Acciones de fila: Ver, Editar y Borrar, el modelo único del panel. Antes esta
  fila ofrecía solo "Ver", así que editar una categoría obligaba a entrar al
  detalle aunque la ruta /categories/{id}/edit existiera desde siempre.

  "Ver productos" NO es una acción de fila: es la columna de datos que lleva al
  sub-recurso, igual que el contador de tags/list. Las acciones quedan para lo
  que se le hace a la entidad.
*/-->

<head>
    <title th:text="${pageTitle}">Categorías</title>
</head>

<body>
    <div layout:fragment="content">

        <th:block th:replace="~{fragments/alerts :: flash(${success}, ${error})}"></th:block>

        <div th:replace="~{fragments/toolbar :: listBar(
                '/categories', 'Buscar categorías...', ${search},
                '/categories/deleted', '/categories/new', 'Nueva Categoría')}"></div>

        <div class="overflow-hidden rounded-xl border border-gray-200 bg-white shadow-sm">
            <div class="overflow-x-auto">
                <table class="min-w-full divide-y divide-gray-200">
                    <caption class="sr-only">Listado de categorías</caption>
                    <thead class="bg-gray-50">
                        <tr>
                            <th th:replace="~{fragments/table :: th('Nombre')}"></th>
                            <th th:replace="~{fragments/table :: th('Descripción')}"></th>
                            <th th:replace="~{fragments/table :: thCenter('Productos')}"></th>
                            <th th:replace="~{fragments/table :: thRight('Acciones')}"></th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-gray-200 bg-white">
                        <tr th:each="category : ${categories.content}" class="hover:bg-gray-50">
                            <td class="whitespace-nowrap px-6 py-4">
                                <a th:href="@{/categories/{id}(id=${category.id})}"
                                   class="font-medium text-gray-900 transition-colors hover:text-primary-600"
                                   th:text="${category.name}"></a>
                            </td>
                            <td class="px-6 py-4">
                                <div class="max-w-xs truncate text-sm text-gray-500"
                                     th:text="${category.description} ?: '—'"></div>
                            </td>
                            <td class="whitespace-nowrap px-6 py-4 text-center">
                                <a th:href="@{/categories/{id}/products(id=${category.id})}"
                                   th:title="'Ver productos de ' + ${category.name}"
                                   class="inline-flex items-center gap-1.5 rounded-full bg-primary-50 px-3 py-1.5 text-sm font-medium text-primary-700 transition-colors hover:bg-primary-100 focus:outline-none focus:ring-2 focus:ring-primary-500 focus:ring-offset-1">
                                    <svg th:replace="~{fragments/icons :: icon('box', 'w-4 h-4')}"></svg>
                                    <span>Ver productos</span>
                                </a>
                            </td>
                            <td class="whitespace-nowrap px-6 py-4 text-right text-sm">
                                <div class="flex items-center justify-end gap-1">
                                    <a th:replace="~{fragments/buttons :: iconLink(
                                            '/categories/' + ${category.id}, 'eye', 'Ver categoría', 'neutral')}"></a>
                                    <a th:replace="~{fragments/buttons :: iconLink(
                                            '/categories/' + ${category.id} + '/edit', 'pencil', 'Editar categoría', 'edit')}"></a>
                                    <form th:replace="~{fragments/buttons :: iconDelete(
                                            '/categories/' + ${category.id} + '/delete',
                                            #{confirm.delete.category},
                                            'Eliminar categoría')}"></form>
                                </div>
                            </td>
                        </tr>

                        <tr th:replace="~{fragments/table :: emptyRow(${categories.content}, 4, 'folder',
                                ${#strings.isEmpty(search)} ? 'No hay categorías registradas' : #{empty.results},
                                'Las categorías agrupan productos en el catálogo.',
                                '/categories/new', 'Crear categoría',
                                ${#strings.isEmpty(search)} ? null : '/categories')}"></tr>
                    </tbody>
                </table>
            </div>

            <div th:replace="~{fragments/pagination :: bar(
                    ${categories}, '/categories', 'categorías', ${ {'search': search} })}"></div>
        </div>
    </div>
</body>

</html>
