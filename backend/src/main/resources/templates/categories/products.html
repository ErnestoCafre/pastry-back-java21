<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/main}">

<!--/*
  Productos de una categoría. Es el único listado en grilla de tarjetas y no en
  tabla, así que usa table :: emptyBody en vez de emptyRow: es exactamente el
  caso para el que existe el primero (mismo estado vacío, fuera de una tabla).

  La paginación sí es la misma que el resto: el bloque anterior era una tercera
  variante, distinta de las otras dos que ya convivían en el proyecto.
*/-->

<head>
    <title th:text="${pageTitle}">Productos de la Categoría</title>
</head>

<body>
    <div layout:fragment="content">

        <th:block th:replace="~{fragments/alerts :: flash(${success}, ${error})}"></th:block>

        <nav th:replace="~{fragments/breadcrumb :: trail('Categorías', '/categories', ${category.name})}"></nav>

        <div class="mb-6 rounded-xl border border-gray-200 bg-white p-6 shadow-sm">
            <div class="flex items-start justify-between gap-4">
                <div>
                    <h2 class="text-2xl font-bold text-gray-900" th:text="${category.name}"></h2>
                    <p class="mt-1 text-gray-500" th:text="${category.description} ?: 'Sin descripción'"></p>
                </div>
                <span class="inline-flex flex-shrink-0 items-center rounded-full bg-primary-100 px-4 py-2 text-sm font-medium text-primary-800">
                    <span th:text="${products.totalElements}"></span>&nbsp;productos
                </span>
            </div>
        </div>

        <div th:if="${!products.content.empty}"
             class="grid grid-cols-1 gap-6 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4">
            <div th:each="product : ${products.content}"
                 class="overflow-hidden rounded-xl border border-gray-200 bg-white shadow-sm transition-shadow hover:shadow-md">
                <div class="h-40 w-full overflow-hidden bg-gray-100">
                    <img th:if="${product.imageUrl != null}" th:src="${product.imageUrl}"
                         th:alt="${product.name}" class="h-full w-full object-cover">
                    <div th:if="${product.imageUrl == null}"
                         class="flex h-full w-full items-center justify-center text-gray-300">
                        <svg th:replace="~{fragments/icons :: icon('image', 'w-12 h-12')}"></svg>
                    </div>
                </div>
                <div class="p-5">
                    <h3 class="mb-2 text-lg font-semibold text-gray-900" th:text="${product.name}"></h3>
                    <p class="mb-4 text-sm text-gray-500"
                       th:text="${product.description} ?: 'Sin descripción'"></p>
                    <span th:if="${product.basePrice}" class="text-xl font-bold text-gray-900"
                          th:text="${@money.format(product.basePrice)}"></span>
                    <th:block th:unless="${product.basePrice}">
                        <span th:replace="~{fragments/table :: muted('Sin precio')}"></span>
                    </th:block>
                </div>
                <div class="flex justify-end gap-1 border-t border-gray-200 bg-gray-50 px-5 py-3">
                    <a th:replace="~{fragments/buttons :: iconLink(
                            '/products/' + ${product.id}, 'eye', 'Ver producto', 'neutral')}"></a>
                    <a th:replace="~{fragments/buttons :: iconLink(
                            '/products/' + ${product.id} + '/edit', 'pencil', 'Editar producto', 'edit')}"></a>
                </div>
            </div>
        </div>

        <div th:if="${products.content.empty}" class="rounded-xl border border-gray-200 bg-white py-12">
            <div th:replace="~{fragments/table :: emptyBody('box',
                    'No hay productos en esta categoría',
                    'Los productos que asignes a esta categoría van a aparecer acá.',
                    '/products/new', 'Crear producto', null)}"></div>
        </div>

        <div class="mt-6 overflow-hidden rounded-xl border border-gray-200 bg-white">
            <div th:replace="~{fragments/pagination :: bar(
                    ${products}, '/categories/' + ${category.id} + '/products', 'productos', null)}"></div>
        </div>
    </div>
</body>

</html>
