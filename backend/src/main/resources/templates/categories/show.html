<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/main}">

<!--/*
  Ficha de categoría.

  El botón "Volver al listado" del pie salió: la miga de pan que está arriba ya
  es el camino de vuelta, y tener dos controles para lo mismo con textos
  distintos era justamente el problema. Entre las siete fichas convivían cuatro
  redacciones ("Volver al listado", "Volver", "Volver a Ventas", "Volver a
  usuarios"). Ahora el pie solo tiene lo que se le hace a la entidad.
*/-->

<head>
    <title th:text="${pageTitle}">Detalle de la Categoría</title>
</head>

<body>
    <div layout:fragment="content">

        <th:block th:replace="~{fragments/alerts :: flash(${success}, ${error})}"></th:block>

        <nav th:replace="~{fragments/breadcrumb :: trail('Categorías', '/categories', ${category.name})}"></nav>

        <div class="max-w-3xl overflow-hidden rounded-xl border border-gray-200 bg-white shadow-sm">
            <div class="p-6">
                <div class="mb-6 flex items-start justify-between gap-4">
                    <h2 class="text-2xl font-bold text-gray-900" th:text="${category.name}"></h2>
                    <div class="flex flex-shrink-0 items-center gap-2 text-primary-600">
                        <svg th:replace="~{fragments/icons :: icon('box', 'w-6 h-6')}"></svg>
                        <span class="text-2xl font-bold" th:text="${productCount}">0</span>
                        <span class="text-gray-500">productos</span>
                    </div>
                </div>

                <p th:if="${category.description}" class="mb-6 text-gray-600"
                   th:text="${category.description}"></p>
                <th:block th:unless="${category.description}">
                    <p class="mb-6"><span th:replace="~{fragments/table :: muted('Sin descripción')}"></span></p>
                </th:block>

                <dl class="grid grid-cols-1 gap-4 sm:grid-cols-2">
                    <div class="rounded-lg bg-gray-50 p-4">
                        <dt class="text-sm font-medium text-gray-500">Fecha de creación</dt>
                        <dd class="mt-1 text-lg font-semibold text-gray-900"
                            th:text="${#temporals.format(category.insertedAt, 'dd/MM/yyyy HH:mm')}"></dd>
                    </div>
                    <div class="rounded-lg bg-gray-50 p-4">
                        <dt class="text-sm font-medium text-gray-500">Última actualización</dt>
                        <dd class="mt-1 text-lg font-semibold text-gray-900"
                            th:text="${#temporals.format(category.updatedAt, 'dd/MM/yyyy HH:mm')}"></dd>
                    </div>
                </dl>

                <div th:if="${productCount > 0}" class="mt-6">
                    <a th:href="@{/categories/{id}/products(id=${category.id})}"
                       class="inline-flex items-center gap-2 text-primary-600 transition-colors hover:text-primary-800">
                        <svg th:replace="~{fragments/icons :: icon('box', 'w-4 h-4')}"></svg>
                        <span>Ver productos de esta categoría</span>
                    </a>
                </div>
            </div>

            <div class="flex justify-end gap-2 border-t border-gray-200 bg-gray-50 px-6 py-4">
                <a th:replace="~{fragments/buttons :: link(
                        '/categories/' + ${category.id} + '/edit', 'Editar', 'pencil', 'primary')}"></a>
                <form th:replace="~{fragments/buttons :: action(
                        '/categories/' + ${category.id} + '/delete',
                        '¿Eliminar esta categoría? Se moverá a la papelera.',
                        'Eliminar', 'trash', 'danger')}"></form>
            </div>
        </div>
    </div>
</body>

</html>
