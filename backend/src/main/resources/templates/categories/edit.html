<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/main}">

<head>
    <title th:text="${pageTitle}">Editar Categoría</title>
</head>

<body>
    <div layout:fragment="content">

        <nav th:replace="~{fragments/breadcrumb :: trail('Categorías', '/categories', 'Editar')}"></nav>

        <div class="max-w-2xl rounded-xl border border-gray-200 bg-white p-6 shadow-sm">
            <div th:replace="~{fragments/alerts :: errorBox(${error})}"></div>

            <form th:action="@{/categories/{id}(id=${categoryId})}" th:object="${category}" method="post"
                  class="space-y-6">
                <div th:replace="~{fragments/alerts :: formErrors}"></div>

                <div th:replace="~{fragments/form :: text(
                        'name', 'Nombre', true, 'Ej: Tortas, Galletas, Cupcakes', null)}"></div>

                <div th:replace="~{fragments/form :: textarea(
                        'description', 'Descripción', false, 'Descripción opcional de la categoría')}"></div>

                <div th:replace="~{fragments/form :: actions('Actualizar Categoría', '/categories')}"></div>
            </form>
        </div>
    </div>
</body>

</html>
