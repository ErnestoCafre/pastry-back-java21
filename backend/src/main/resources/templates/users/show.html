<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/main}">

<!--/*
  Ficha de usuario.

  Era la única de las siete sin miga de pan, y encima tenía DOS controles de
  retorno con textos distintos: un "Volver a usuarios" arriba y un "Volver a la
  lista" en el pie, los dos apuntando al mismo lado. Ahora tiene la miga como
  el resto y ninguno de los dos botones.

  El toggle usa buttons :: action, así que su tamaño coincide con el de Editar
  y su confirmación sale del mismo listener delegado que el resto del panel.
  Antes no confirmaba nada: desactivar a alguien se hacía de un clic.
*/-->

<head>
    <title th:text="${pageTitle}">Detalle del Usuario</title>
</head>

<body>
    <div layout:fragment="content">

        <th:block th:replace="~{fragments/alerts :: flash(${success}, ${error})}"></th:block>

        <nav th:replace="~{fragments/breadcrumb :: trail('Usuarios', '/users', ${user.fullName})}"></nav>

        <div class="max-w-3xl overflow-hidden rounded-xl border border-gray-200 bg-white shadow-sm">
            <div class="bg-gradient-to-r from-primary-600 to-primary-700 px-6 py-4">
                <div class="flex items-center gap-4">
                    <div aria-hidden="true"
                         class="flex h-16 w-16 items-center justify-center rounded-full bg-white/20">
                        <span class="text-2xl font-bold text-white"
                              th:text="${#strings.substring(user.name, 0, 1).toUpperCase()}">U</span>
                    </div>
                    <div>
                        <h2 class="text-xl font-semibold text-white" th:text="${user.fullName}">Nombre Usuario</h2>
                        <p class="text-white/80" th:text="${user.email}">email@example.com</p>
                    </div>
                </div>
            </div>

            <div class="p-6">
                <dl class="grid grid-cols-1 gap-6 md:grid-cols-2">
                    <div>
                        <dt class="text-sm font-medium text-gray-500">Nombre</dt>
                        <dd class="mt-1 text-sm text-gray-900" th:text="${user.name}">-</dd>
                    </div>
                    <div>
                        <dt class="text-sm font-medium text-gray-500">Apellido</dt>
                        <dd class="mt-1 text-sm text-gray-900" th:text="${user.lastName} ?: '—'">-</dd>
                    </div>
                    <div>
                        <dt class="text-sm font-medium text-gray-500">Email</dt>
                        <dd class="mt-1 text-sm text-gray-900" th:text="${user.email}">-</dd>
                    </div>
                    <div>
                        <dt class="text-sm font-medium text-gray-500">Rol</dt>
                        <dd class="mt-1">
                            <span class="inline-flex items-center rounded-full px-2.5 py-0.5 text-xs font-medium"
                                  th:classappend="${user.role.name.name() == 'ADMIN'} ? 'bg-purple-100 text-purple-800' : 'bg-gray-100 text-gray-800'"
                                  th:text="${user.role.name.name()}">Rol</span>
                        </dd>
                    </div>
                    <div>
                        <dt class="text-sm font-medium text-gray-500">Estado</dt>
                        <dd class="mt-1">
                            <span th:if="${user.enabled}"
                                  class="inline-flex items-center rounded-full bg-green-100 px-2.5 py-0.5 text-xs font-medium text-green-800">Activo</span>
                            <span th:unless="${user.enabled}"
                                  class="inline-flex items-center rounded-full bg-red-100 px-2.5 py-0.5 text-xs font-medium text-red-800">Inactivo</span>
                        </dd>
                    </div>
                    <!--/* insertedAt, no createdAt: User hereda de TimestampedEntity, que
                           expone insertedAt y updatedAt. La plantilla pedía user.createdAt,
                           una propiedad que no existe, y SpEL falla al evaluarla. */-->
                    <div>
                        <dt class="text-sm font-medium text-gray-500">Creado</dt>
                        <dd class="mt-1 text-sm text-gray-900"
                            th:text="${@dates.format(user.insertedAt)}">-</dd>
                    </div>
                    <div>
                        <dt class="text-sm font-medium text-gray-500">Última actualización</dt>
                        <dd class="mt-1 text-sm text-gray-900"
                            th:text="${@dates.format(user.updatedAt)}">-</dd>
                    </div>
                </dl>
            </div>

            <div class="flex justify-end gap-2 border-t border-gray-200 bg-gray-50 px-6 py-4">
                <a th:replace="~{fragments/buttons :: link(
                        '/users/' + ${user.id} + '/edit', 'Editar', 'pencil', 'primary')}"></a>
                <form th:replace="~{fragments/buttons :: action(
                        '/users/' + ${user.id} + '/toggle',
                        ${user.enabled} ? #{confirm.disable.user} : null,
                        ${user.enabled} ? 'Desactivar' : 'Activar',
                        ${user.enabled} ? 'ban' : 'check-circle',
                        ${user.enabled} ? 'danger' : 'secondary')}"></form>
            </div>
        </div>
    </div>
</body>

</html>
