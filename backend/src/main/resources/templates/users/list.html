<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/main}">

<!--/*
  Acciones de fila: Ver, Editar y Activar/Desactivar.

  Es la excepción justificada al modelo Ver/Editar/Borrar del resto del panel:
  no existe ruta de borrado de usuarios. Un usuario que ya registró ventas no
  se elimina —la venta guarda quién la cargó—, se desactiva. Por eso acá la
  tercera acción es el toggle y no una papelera, y por eso listBar recibe null
  como trashUrl.

  El toggle ahora usa buttons :: iconSubmit, así que su anillo de foco y su
  texto para lectores de pantalla salen del mismo lugar que los del resto.
*/-->

<head>
    <title th:text="${pageTitle}">Usuarios</title>
</head>

<body>
    <div layout:fragment="content">

        <th:block th:replace="~{fragments/alerts :: flash(${success}, ${error})}"></th:block>

        <!--/* Sin buscador y sin papelera, y las dos ausencias son deliberadas.

               La caja de búsqueda que había acá NO funcionaba: UserController.list
               no acepta el parámetro `search`, así que escribir algo y enviar
               recargaba la lista entera sin decir nada. Se saca hasta que exista
               búsqueda de usuarios de verdad; hoy no hay ni consulta en el
               repositorio. */-->
        <div th:replace="~{fragments/toolbar :: listBar(
                null, null, null,
                null, '/users/new', 'Nuevo Usuario')}"></div>

        <div class="overflow-hidden rounded-xl border border-gray-200 bg-white shadow-sm">
            <div class="overflow-x-auto">
                <table class="min-w-full divide-y divide-gray-200">
                    <caption class="sr-only">Listado de usuarios del panel</caption>
                    <thead class="bg-gray-50">
                        <tr>
                            <th th:replace="~{fragments/table :: th('Usuario')}"></th>
                            <th th:replace="~{fragments/table :: th('Email')}"></th>
                            <th th:replace="~{fragments/table :: th('Rol')}"></th>
                            <th th:replace="~{fragments/table :: th('Estado')}"></th>
                            <th th:replace="~{fragments/table :: thRight('Acciones')}"></th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-gray-200 bg-white">
                        <tr th:each="user : ${users.content}" class="hover:bg-gray-50">
                            <td class="whitespace-nowrap px-6 py-4">
                                <div class="flex items-center gap-3">
                                    <div aria-hidden="true"
                                         class="flex h-10 w-10 flex-shrink-0 items-center justify-center rounded-full bg-primary-100">
                                        <span class="font-semibold text-primary-600"
                                              th:text="${#strings.substring(user.name, 0, 1).toUpperCase()}">U</span>
                                    </div>
                                    <a th:href="@{/users/{id}(id=${user.id})}"
                                       class="font-medium text-gray-900 transition-colors hover:text-primary-600"
                                       th:text="${user.fullName}"></a>
                                </div>
                            </td>
                            <td class="whitespace-nowrap px-6 py-4">
                                <div class="text-sm text-gray-600" th:text="${user.email}"></div>
                            </td>
                            <td class="whitespace-nowrap px-6 py-4">
                                <span class="inline-flex items-center rounded-full px-2.5 py-0.5 text-xs font-medium"
                                      th:classappend="${user.role.name.name() == 'ADMIN'} ? 'bg-purple-100 text-purple-800' : 'bg-gray-100 text-gray-800'"
                                      th:text="${user.role.name.name()}">Rol</span>
                            </td>
                            <td class="whitespace-nowrap px-6 py-4">
                                <span th:if="${user.enabled}"
                                      class="inline-flex items-center rounded-full bg-green-100 px-2.5 py-0.5 text-xs font-medium text-green-800">Activo</span>
                                <span th:unless="${user.enabled}"
                                      class="inline-flex items-center rounded-full bg-red-100 px-2.5 py-0.5 text-xs font-medium text-red-800">Inactivo</span>
                            </td>
                            <td class="whitespace-nowrap px-6 py-4 text-right text-sm">
                                <div class="flex items-center justify-end gap-1">
                                    <a th:replace="~{fragments/buttons :: iconLink(
                                            '/users/' + ${user.id}, 'eye', 'Ver usuario', 'neutral')}"></a>
                                    <a th:replace="~{fragments/buttons :: iconLink(
                                            '/users/' + ${user.id} + '/edit', 'pencil', 'Editar usuario', 'edit')}"></a>
                                    <form th:replace="~{fragments/buttons :: iconSubmit(
                                            '/users/' + ${user.id} + '/toggle',
                                            ${user.enabled} ? 'ban' : 'check-circle',
                                            ${user.enabled} ? 'Desactivar usuario' : 'Activar usuario',
                                            ${user.enabled} ? 'danger' : 'success',
                                            ${user.enabled} ? '¿Desactivar este usuario? No va a poder iniciar sesión.' : null)}"></form>
                                </div>
                            </td>
                        </tr>

                        <!--/* Sin filtros: el estado vacío solo puede ser "todavía no hay". */-->
                        <tr th:replace="~{fragments/table :: emptyRow(${users.content}, 5, 'users',
                                'No hay usuarios registrados',
                                'Los usuarios acceden al panel de administración.',
                                '/users/new', 'Crear usuario', null)}"></tr>
                    </tbody>
                </table>
            </div>

            <div th:replace="~{fragments/pagination :: bar(
                    ${users}, '/users', 'usuarios', null)}"></div>
        </div>
    </div>
</body>

</html>
