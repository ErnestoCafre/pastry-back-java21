<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/main}">

<!--/*
  Papelera de secciones. Ver categories/deleted para el patrón.

  Acentos: el encabezado decía "Descripcion" sin tilde.
*/-->

<head>
    <title th:text="${pageTitle}">Secciones eliminadas</title>
</head>

<body>
    <div layout:fragment="content">

        <th:block th:replace="~{fragments/alerts :: flash(${success}, ${error})}"></th:block>

        <div th:replace="~{fragments/breadcrumb :: back('Volver a Secciones', '/sections')}"></div>

        <div class="overflow-hidden rounded-xl border border-gray-200 bg-white shadow-sm">
            <div class="overflow-x-auto">
                <table class="min-w-full divide-y divide-gray-200">
                    <caption class="sr-only">Secciones en la papelera</caption>
                    <thead class="bg-gray-50">
                        <tr>
                            <th th:replace="~{fragments/table :: th('Nombre')}"></th>
                            <th th:replace="~{fragments/table :: th('Descripción')}"></th>
                            <th th:replace="~{fragments/table :: th('Eliminada')}"></th>
                            <th th:replace="~{fragments/table :: th('Eliminada por')}"></th>
                            <th th:replace="~{fragments/table :: thRight('Acciones')}"></th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-gray-200 bg-white">
                        <tr th:each="section : ${sections.content}" class="hover:bg-gray-50">
                            <td class="whitespace-nowrap px-6 py-4">
                                <span class="inline-flex items-center gap-2 rounded-full bg-gray-100 px-3 py-1 text-sm font-medium text-gray-600">
                                    <svg th:replace="~{fragments/icons :: icon('list', 'w-4 h-4')}"></svg>
                                    <span th:text="${section.name}"></span>
                                </span>
                            </td>
                            <td class="px-6 py-4">
                                <div class="max-w-xs truncate text-sm text-gray-500"
                                     th:text="${section.description} ?: '—'"></div>
                            </td>
                            <td class="whitespace-nowrap px-6 py-4 text-sm text-gray-500"
                                th:text="${#temporals.format(section.deletedAt, 'dd/MM/yyyy HH:mm')}"></td>
                            <td class="whitespace-nowrap px-6 py-4 text-sm text-gray-500"
                                th:text="${section.deletedBy?.fullName} ?: 'Desconocido'"></td>
                            <td class="whitespace-nowrap px-6 py-4 text-right">
                                <div class="flex items-center justify-end gap-2">
                                    <form th:replace="~{fragments/buttons :: pill(
                                            '/sections/' + ${section.id} + '/restore', null,
                                            'Restaurar', 'restore', 'safe')}"></form>
                                    <form th:replace="~{fragments/buttons :: pill(
                                            '/sections/' + ${section.id} + '/hard-delete',
                                            '¿Eliminar PERMANENTEMENTE esta sección? Esta acción no se puede deshacer.',
                                            'Eliminar', 'trash', 'danger')}"></form>
                                </div>
                            </td>
                        </tr>

                        <tr th:replace="~{fragments/table :: emptyRow(${sections.content}, 5, 'trash',
                                'La papelera está vacía',
                                'Las secciones que elimines aparecerán acá y podrás restaurarlas.',
                                null, null, null)}"></tr>
                    </tbody>
                </table>
            </div>

            <div th:replace="~{fragments/pagination :: bar(
                    ${sections}, '/sections/deleted', 'secciones', null)}"></div>
        </div>
    </div>
</body>

</html>
