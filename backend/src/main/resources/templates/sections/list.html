<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/main}">

<!--/*
  Acciones de fila: Ver, Editar y Borrar. Antes eran "Ver" y "Ver productos"
  mezcladas en la misma celda; el sub-recurso vuelve a su columna de datos.

  Acentos: el encabezado decía "Descripcion" y la insignia de visible decía
  "Si" sin tilde.
*/-->

<head>
    <title th:text="${pageTitle}">Secciones</title>
</head>

<body>
    <div layout:fragment="content">

        <th:block th:replace="~{fragments/alerts :: flash(${success}, ${error})}"></th:block>

        <div th:replace="~{fragments/toolbar :: listBar(
                '/sections', 'Buscar secciones...', ${search},
                '/sections/deleted', '/sections/new', 'Nueva Sección')}"></div>

        <div class="overflow-hidden rounded-xl border border-gray-200 bg-white shadow-sm">
            <div class="overflow-x-auto">
                <table class="min-w-full divide-y divide-gray-200">
                    <caption class="sr-only">Listado de secciones de la vitrina</caption>
                    <thead class="bg-gray-50">
                        <tr>
                            <th th:replace="~{fragments/table :: th('Nombre')}"></th>
                            <th th:replace="~{fragments/table :: th('Descripción')}"></th>
                            <th th:replace="~{fragments/table :: thCenter('Orden')}"></th>
                            <th th:replace="~{fragments/table :: thCenter('Visible')}"></th>
                            <th th:replace="~{fragments/table :: thCenter('Productos')}"></th>
                            <th th:replace="~{fragments/table :: thRight('Acciones')}"></th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-gray-200 bg-white">
                        <tr th:each="section : ${sections.content}" class="hover:bg-gray-50">
                            <td class="whitespace-nowrap px-6 py-4">
                                <a th:href="@{/sections/{id}(id=${section.id})}" class="group inline-flex">
                                    <span class="inline-flex items-center gap-2 rounded-full bg-primary-100 px-3 py-1 text-sm font-medium text-primary-800 transition-colors group-hover:bg-primary-200">
                                        <svg th:replace="~{fragments/icons :: icon('list', 'w-4 h-4')}"></svg>
                                        <span th:text="${section.name}"></span>
                                    </span>
                                </a>
                            </td>
                            <td class="px-6 py-4">
                                <div class="max-w-xs truncate text-sm text-gray-500"
                                     th:text="${section.description} ?: '—'"></div>
                            </td>
                            <td class="whitespace-nowrap px-6 py-4 text-center">
                                <span class="text-sm text-gray-700" th:text="${section.displayOrder} ?: '—'"></span>
                            </td>
                            <td class="whitespace-nowrap px-6 py-4 text-center">
                                <span th:if="${section.visible}"
                                      class="inline-flex items-center rounded-full bg-green-100 px-2.5 py-0.5 text-xs font-medium text-green-800">Sí</span>
                                <span th:unless="${section.visible}"
                                      class="inline-flex items-center rounded-full bg-gray-100 px-2.5 py-0.5 text-xs font-medium text-gray-800">No</span>
                            </td>
                            <td class="whitespace-nowrap px-6 py-4 text-center">
                                <a th:href="@{/sections/{id}/products(id=${section.id})}"
                                   th:title="'Ver productos de ' + ${section.name}"
                                   class="inline-flex items-center gap-1.5 rounded-full bg-primary-50 px-3 py-1.5 text-sm font-medium text-primary-700 transition-colors hover:bg-primary-100 focus:outline-none focus:ring-2 focus:ring-primary-500 focus:ring-offset-1">
                                    <svg th:replace="~{fragments/icons :: icon('box', 'w-4 h-4')}"></svg>
                                    <span>Ver</span>
                                </a>
                            </td>
                            <td class="whitespace-nowrap px-6 py-4 text-right text-sm">
                                <div class="flex items-center justify-end gap-1">
                                    <a th:replace="~{fragments/buttons :: iconLink(
                                            '/sections/' + ${section.id}, 'eye', 'Ver sección', 'neutral')}"></a>
                                    <a th:replace="~{fragments/buttons :: iconLink(
                                            '/sections/' + ${section.id} + '/edit', 'pencil', 'Editar sección', 'edit')}"></a>
                                    <form th:replace="~{fragments/buttons :: iconDelete(
                                            '/sections/' + ${section.id} + '/delete',
                                            #{confirm.delete.section},
                                            'Eliminar sección')}"></form>
                                </div>
                            </td>
                        </tr>

                        <tr th:replace="~{fragments/table :: emptyRow(${sections.content}, 6, 'list',
                                ${#strings.isEmpty(search)} ? 'No hay secciones registradas' : #{empty.results},
                                'Las secciones ordenan cómo se muestran los productos en la vitrina pública.',
                                '/sections/new', 'Crear sección',
                                ${#strings.isEmpty(search)} ? null : '/sections')}"></tr>
                    </tbody>
                </table>
            </div>

            <div th:replace="~{fragments/pagination :: bar(
                    ${sections}, '/sections', 'secciones', ${ {'search': search} })}"></div>
        </div>
    </div>
</body>

</html>
