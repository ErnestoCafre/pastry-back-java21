<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/main}">

<!--/*
  Productos de una sección de vitrina. Mismo patrón que tags/products, con una
  diferencia propia: cada producto lleva un orden de visualización editable en
  la fila, porque el orden es la razón de ser de las secciones.

  Ese campo tenía un <input> con `title` como única etiqueta, que no es una
  etiqueta accesible: ahora lleva un <label class="sr-only"> asociado por id.
  El id incluye el del producto para que no se repita entre filas.
*/-->

<head>
    <title th:text="${pageTitle}">Productos de la Sección</title>
</head>

<body>
    <div layout:fragment="content">

        <th:block th:replace="~{fragments/alerts :: flash(${success}, ${error})}"></th:block>

        <nav th:replace="~{fragments/breadcrumb :: trailDeep(
                'Secciones', '/sections', ${section.name}, '/sections/' + ${section.id}, 'Productos')}"></nav>

        <div class="grid grid-cols-1 gap-6 lg:grid-cols-2">

            <div class="overflow-hidden rounded-xl border border-gray-200 bg-white shadow-sm">
                <div class="border-b border-gray-200 bg-gray-50 px-6 py-4">
                    <h2 class="text-lg font-semibold text-gray-900">Productos en esta sección</h2>
                    <p class="text-sm text-gray-500"
                       th:text="${#lists.size(sectionProducts)} + ' producto(s)'"></p>
                </div>
                <div class="divide-y divide-gray-200">
                    <div th:each="sp : ${sectionProducts}"
                         class="flex items-center justify-between gap-2 px-6 py-4 hover:bg-gray-50">
                        <div class="flex flex-1 items-center gap-3">
                            <div class="h-10 w-10 flex-shrink-0 overflow-hidden rounded-lg bg-primary-100">
                                <img th:if="${sp.product.imageUrl != null}" th:src="${sp.product.imageUrl}"
                                     th:alt="${sp.product.name}" class="h-full w-full object-cover">
                                <div th:if="${sp.product.imageUrl == null}"
                                     class="flex h-full w-full items-center justify-center text-primary-600">
                                    <svg th:replace="~{fragments/icons :: icon('box', 'w-5 h-5')}"></svg>
                                </div>
                            </div>
                            <div class="min-w-0 flex-1">
                                <a th:href="@{/products/{id}(id=${sp.product.id})}"
                                   class="font-medium text-gray-900 transition-colors hover:text-primary-600"
                                   th:text="${sp.product.name}"></a>
                                <p th:if="${sp.product.category}" class="text-sm text-gray-500"
                                   th:text="${sp.product.category?.name}"></p>
                            </div>

                            <form th:action="@{/sections/{sectionId}/products/{productId}/update-order(sectionId=${section.id}, productId=${sp.product.id})}"
                                  method="post" class="flex flex-shrink-0 items-center gap-1">
                                <label th:for="'order-' + ${sp.product.id}" class="sr-only"
                                       th:text="'Orden de ' + ${sp.product.name}">Orden</label>
                                <input type="number" name="displayOrder" th:id="'order-' + ${sp.product.id}"
                                       th:value="${sp.displayOrder}" placeholder="#"
                                       class="w-16 rounded border border-gray-300 px-2 py-1 text-center text-sm focus:border-primary-500 focus:ring-primary-500">
                                <button type="submit" title="Actualizar orden"
                                        class="rounded p-1 text-primary-600 transition-colors hover:bg-primary-50 focus:outline-none focus:ring-2 focus:ring-primary-500">
                                    <svg th:replace="~{fragments/icons :: icon('check-circle', 'w-4 h-4')}"></svg>
                                    <span class="sr-only">Actualizar orden</span>
                                </button>
                            </form>
                        </div>

                        <form th:replace="~{fragments/buttons :: iconSubmit(
                                '/sections/' + ${section.id} + '/products/' + ${sp.product.id} + '/remove',
                                'x', 'Quitar de la sección', 'danger',
                                '¿Quitar este producto de la sección?')}"></form>
                    </div>

                    <div th:if="${#lists.isEmpty(sectionProducts)}" class="px-6 py-8">
                        <div th:replace="~{fragments/table :: emptyBody('box',
                                'No hay productos en esta sección',
                                'Agregá alguno desde el panel de la derecha.',
                                null, null, null)}"></div>
                    </div>
                </div>
            </div>

            <div class="overflow-hidden rounded-xl border border-gray-200 bg-white shadow-sm">
                <div class="border-b border-gray-200 bg-gray-50 px-6 py-4">
                    <h2 class="text-lg font-semibold text-gray-900">Agregar producto</h2>
                    <p class="text-sm text-gray-500"
                       th:text="${#lists.size(availableProducts)} + ' disponible(s)'"></p>
                </div>
                <div class="max-h-96 divide-y divide-gray-200 overflow-y-auto">
                    <div th:each="product : ${availableProducts}"
                         class="flex items-center justify-between px-6 py-4 hover:bg-gray-50">
                        <div class="flex items-center gap-3">
                            <div class="h-10 w-10 flex-shrink-0 overflow-hidden rounded-lg bg-gray-100">
                                <img th:if="${product.imageUrl != null}" th:src="${product.imageUrl}"
                                     th:alt="${product.name}" class="h-full w-full object-cover">
                                <div th:if="${product.imageUrl == null}"
                                     class="flex h-full w-full items-center justify-center text-gray-500">
                                    <svg th:replace="~{fragments/icons :: icon('box', 'w-5 h-5')}"></svg>
                                </div>
                            </div>
                            <div>
                                <span class="font-medium text-gray-900" th:text="${product.name}"></span>
                                <p th:if="${product.category}" class="text-sm text-gray-500"
                                   th:text="${product.category?.name}"></p>
                            </div>
                        </div>
                        <form th:replace="~{fragments/buttons :: iconSubmit(
                                '/sections/' + ${section.id} + '/products/' + ${product.id},
                                'plus', 'Agregar a la sección', 'success', null)}"></form>
                    </div>

                    <div th:if="${#lists.isEmpty(availableProducts)}" class="px-6 py-8">
                        <div th:replace="~{fragments/table :: emptyBody('check-circle',
                                'Todos los productos ya están en esta sección',
                                null, null, null, null)}"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
