<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/main}">

<!--/*
  Ficha de tag. El "Volver al listado" del pie salió (ver categories/show).

  El texto de borrado ahora es el mismo que el de la fila del listado. Antes
  eran dos: "¿Estas seguro de eliminar este tag? Se movera a la papelera." acá
  y otro distinto en tags/list, para exactamente la misma acción.

  Acentos: "Sin descripcion", "Fecha de creacion", "Ultima actualizacion" y la
  confirmación entera venían sin tildes.
*/-->

<head>
    <title th:text="${pageTitle}">Detalle del Tag</title>
</head>

<body>
    <div layout:fragment="content">

        <th:block th:replace="~{fragments/alerts :: flash(${success}, ${error})}"></th:block>

        <nav th:replace="~{fragments/breadcrumb :: trail('Tags', '/tags', ${tag.name})}"></nav>

        <div class="max-w-3xl overflow-hidden rounded-xl border border-gray-200 bg-white shadow-sm">
            <div class="p-6">
                <div class="mb-6 flex items-start justify-between gap-4">
                    <span class="inline-flex items-center gap-2 rounded-full bg-primary-100 px-4 py-2 text-lg font-medium text-primary-800">
                        <svg th:replace="~{fragments/icons :: icon('tag', 'w-5 h-5')}"></svg>
                        <span th:text="${tag.name}"></span>
                    </span>
                    <div class="flex flex-shrink-0 items-center gap-2 text-primary-600">
                        <svg th:replace="~{fragments/icons :: icon('box', 'w-6 h-6')}"></svg>
                        <span class="text-2xl font-bold" th:text="${usageCount}">0</span>
                        <span class="text-gray-500">productos</span>
                    </div>
                </div>

                <p th:if="${tag.description}" class="mb-6 text-gray-600" th:text="${tag.description}"></p>
                <th:block th:unless="${tag.description}">
                    <p class="mb-6"><span th:replace="~{fragments/table :: muted(#{empty.description})}"></span></p>
                </th:block>

                <div class="mb-6 rounded-lg bg-gray-50 p-4">
                    <dt class="mb-1 text-sm font-medium text-gray-500">Slug (identificador)</dt>
                    <dd class="font-mono text-sm text-gray-900" th:text="${tag.slug}"></dd>
                </div>

                <dl class="grid grid-cols-1 gap-4 sm:grid-cols-2">
                    <div class="rounded-lg bg-gray-50 p-4">
                        <dt class="text-sm font-medium text-gray-500">Fecha de creación</dt>
                        <dd class="mt-1 text-lg font-semibold text-gray-900"
                            th:text="${@dates.format(tag.insertedAt)}"></dd>
                    </div>
                    <div class="rounded-lg bg-gray-50 p-4">
                        <dt class="text-sm font-medium text-gray-500">Última actualización</dt>
                        <dd class="mt-1 text-lg font-semibold text-gray-900"
                            th:text="${@dates.format(tag.updatedAt)}"></dd>
                    </div>
                </dl>
            </div>

            <div class="flex justify-end gap-2 border-t border-gray-200 bg-gray-50 px-6 py-4">
                <a th:replace="~{fragments/buttons :: link(
                        '/tags/' + ${tag.id} + '/products', 'Ver productos', 'box', 'secondary')}"></a>
                <a th:replace="~{fragments/buttons :: link(
                        '/tags/' + ${tag.id} + '/edit', 'Editar', 'pencil', 'primary')}"></a>
                <form th:replace="~{fragments/buttons :: action(
                        '/tags/' + ${tag.id} + '/delete',
                        #{confirm.delete.tag},
                        'Eliminar', 'trash', 'danger')}"></form>
            </div>
        </div>
    </div>
</body>

</html>
