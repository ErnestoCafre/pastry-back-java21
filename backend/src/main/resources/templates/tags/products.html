<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/main}">

<!--/*
  Productos de un tag. Estrena breadcrumb :: trailDeep, que estaba escrito y
  sin ningún consumidor: acá la miga tiene tres niveles (Tags › el tag ›
  Productos) y hasta ahora se armaba a mano en cada una de las cuatro páginas
  que la necesitan.

  Se quita el <h1> propio: el layout ya dibuja uno con pageTitle ("Productos
  con tag: X"), así que la página tenía dos y el lector de pantalla anunciaba
  dos títulos de nivel 1. El del layout además dice más.

  El "Volver a Tags" también sale: la miga es el camino de vuelta, igual que en
  las fichas de detalle.
*/-->

<head>
    <title th:text="${pageTitle}">Productos del Tag</title>
</head>

<body>
    <div layout:fragment="content">

        <th:block th:replace="~{fragments/alerts :: flash(${success}, ${error})}"></th:block>

        <nav th:replace="~{fragments/breadcrumb :: trailDeep(
                'Tags', '/tags', ${tag.name}, '/tags/' + ${tag.id}, 'Productos')}"></nav>

        <div class="grid grid-cols-1 gap-6 lg:grid-cols-2">

            <div class="overflow-hidden rounded-xl border border-gray-200 bg-white shadow-sm">
                <div class="border-b border-gray-200 bg-gray-50 px-6 py-4">
                    <h2 class="text-lg font-semibold text-gray-900">Productos con este tag</h2>
                    <p class="text-sm text-gray-500" th:text="${#lists.size(products)} + ' producto(s)'"></p>
                </div>
                <div class="divide-y divide-gray-200">
                    <div th:each="product : ${products}"
                         class="flex items-center justify-between px-6 py-4 hover:bg-gray-50">
                        <div class="flex items-center gap-3">
                            <div class="h-10 w-10 flex-shrink-0 overflow-hidden rounded-lg bg-primary-100">
                                <img th:if="${product.imageUrl != null}" th:src="${product.imageUrl}"
                                     th:alt="${product.name}" class="h-full w-full object-cover">
                                <div th:if="${product.imageUrl == null}"
                                     class="flex h-full w-full items-center justify-center text-primary-600">
                                    <svg th:replace="~{fragments/icons :: icon('box', 'w-5 h-5')}"></svg>
                                </div>
                            </div>
                            <div>
                                <a th:href="@{/products/{id}(id=${product.id})}"
                                   class="font-medium text-gray-900 transition-colors hover:text-primary-600"
                                   th:text="${product.name}"></a>
                                <p th:if="${product.category}" class="text-sm text-gray-500"
                                   th:text="${product.category?.name}"></p>
                            </div>
                        </div>
                        <form th:replace="~{fragments/buttons :: iconSubmit(
                                '/tags/' + ${tag.id} + '/products/' + ${product.id} + '/remove',
                                'x', 'Quitar del tag', 'danger',
                                #{confirm.remove.productFromTag})}"></form>
                    </div>

                    <div th:if="${#lists.isEmpty(products)}" class="px-6 py-8">
                        <div th:replace="~{fragments/table :: emptyBody('box',
                                'No hay productos con este tag',
                                'Agregá alguno desde el panel de la derecha.',
                                null, null, null)}"></div>
                    </div>
                </div>
            </div>

            <div class="overflow-hidden rounded-xl border border-gray-200 bg-white shadow-sm">
                <div class="border-b border-gray-200 bg-gray-50 px-6 py-4">
                    <h2 class="text-lg font-semibold text-gray-900">Agregar producto</h2>
                    <p class="text-sm text-gray-500"
                       th:text="${#lists.size(availableProducts)} + ' disponible(s)'"></p>
                </div>
                <div class="max-h-96 divide-y divide-gray-200 overflow-y-auto">
                    <div th:each="product : ${availableProducts}"
                         class="flex items-center justify-between px-6 py-4 hover:bg-gray-50">
                        <div class="flex items-center gap-3">
                            <div class="h-10 w-10 flex-shrink-0 overflow-hidden rounded-lg bg-gray-100">
                                <img th:if="${product.imageUrl != null}" th:src="${product.imageUrl}"
                                     th:alt="${product.name}" class="h-full w-full object-cover">
                                <div th:if="${product.imageUrl == null}"
                                     class="flex h-full w-full items-center justify-center text-gray-500">
                                    <svg th:replace="~{fragments/icons :: icon('box', 'w-5 h-5')}"></svg>
                                </div>
                            </div>
                            <div>
                                <span class="font-medium text-gray-900" th:text="${product.name}"></span>
                                <p th:if="${product.category}" class="text-sm text-gray-500"
                                   th:text="${product.category?.name}"></p>
                            </div>
                        </div>
                        <!--/* Agregar no destruye nada: no confirma. */-->
                        <form th:replace="~{fragments/buttons :: iconSubmit(
                                '/tags/' + ${tag.id} + '/products/' + ${product.id},
                                'plus', 'Agregar al tag', 'success', null)}"></form>
                    </div>

                    <div th:if="${#lists.isEmpty(availableProducts)}" class="px-6 py-8">
                        <div th:replace="~{fragments/table :: emptyBody('check-circle',
                                'Todos los productos ya tienen este tag',
                                null, null, null, null)}"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
