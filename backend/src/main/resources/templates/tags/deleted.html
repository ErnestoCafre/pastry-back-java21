<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/main}">

<head>
    <title th:text="${pageTitle}">Tags Eliminados</title>
</head>

<body>
    <div layout:fragment="content">

        <th:block th:replace="~{fragments/alerts :: flash(${success}, ${error})}"></th:block>

        <div th:replace="~{fragments/breadcrumb :: back('Volver a Tags', '/tags')}"></div>

        <div class="overflow-hidden rounded-xl border border-gray-200 bg-white shadow-sm">
            <div class="overflow-x-auto">
                <table class="min-w-full divide-y divide-gray-200">
                    <caption class="sr-only">Tags en la papelera</caption>
                    <thead class="bg-gray-50">
                        <tr>
                            <th th:replace="~{fragments/table :: thLeft('Nombre')}"></th>
                            <th th:replace="~{fragments/table :: thLeft('Descripción')}"></th>
                            <th th:replace="~{fragments/table :: thLeft('Eliminado')}"></th>
                            <th th:replace="~{fragments/table :: thLeft('Eliminado por')}"></th>
                            <th th:replace="~{fragments/table :: thRight('Acciones')}"></th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-gray-200 bg-white">
                        <tr th:each="tag : ${tags.content}" class="hover:bg-gray-50">
                            <td class="whitespace-nowrap px-6 py-4">
                                <div class="font-medium text-gray-600" th:text="${tag.name}"></div>
                            </td>
                            <td class="px-6 py-4">
                                <div class="max-w-xs truncate">
                                    <span th:if="${tag.description != null}" class="text-sm text-gray-500"
                                          th:text="${tag.description}"></span>
                                    <!--/* El th:unless va en un envoltorio y NO junto al
                                           th:replace: juntos, la condicion no se evalua. */-->
                                    <th:block th:unless="${tag.description != null}">
                                        <span th:replace="~{fragments/table :: muted(#{empty.description})}"></span>
                                    </th:block>
                                </div>
                            </td>
                            <td class="whitespace-nowrap px-6 py-4 text-sm text-gray-500"
                                th:text="${@dates.format(tag.deletedAt)}"></td>
                            <td class="whitespace-nowrap px-6 py-4 text-sm text-gray-500"
                                th:text="${tag.deletedBy?.fullName} ?: #{empty.user}"></td>
                            <td class="whitespace-nowrap px-6 py-4 text-right">
                                <div class="flex items-center justify-end gap-2">
                                    <!-- Restaurar no confirma: es reversible. -->
                                    <form th:replace="~{fragments/buttons :: pill(
                                            '/tags/' + ${tag.id} + '/restore', null,
                                            'Restaurar', 'restore', 'safe')}"></form>
                                    <form th:replace="~{fragments/buttons :: pill(
                                            '/tags/' + ${tag.id} + '/hard-delete',
                                            #{confirm.hardDelete.tag},
                                            'Eliminar', 'trash', 'danger')}"></form>
                                </div>
                            </td>
                        </tr>

                        <!--/* La papelera no tiene filtros ni CTA: nada que crear ni que limpiar. */-->
                        <tr th:replace="~{fragments/table :: emptyRow(${tags.content}, 5, 'trash',
                                'La papelera está vacía',
                                'Los tags que elimines aparecerán acá y podrás restaurarlos.',
                                null, null, null)}"></tr>
                    </tbody>
                </table>
            </div>

            <div th:replace="~{fragments/pagination :: bar(
                    ${tags}, '/tags/deleted', 'tags', null)}"></div>
        </div>
    </div>
</body>

</html>
