<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/main}">

<!--/* Papelera de productos. Ver categories/deleted para el patrón. */-->

<head>
    <title th:text="${pageTitle}">Productos eliminados</title>
</head>

<body>
    <div layout:fragment="content">

        <th:block th:replace="~{fragments/alerts :: flash(${success}, ${error})}"></th:block>

        <div th:replace="~{fragments/breadcrumb :: back('Volver a Productos', '/products')}"></div>

        <div class="overflow-hidden rounded-xl border border-gray-200 bg-white shadow-sm">
            <div class="overflow-x-auto">
                <table class="min-w-full divide-y divide-gray-200">
                    <caption class="sr-only">Productos en la papelera</caption>
                    <thead class="bg-gray-50">
                        <tr>
                            <th th:replace="~{fragments/table :: th('Nombre')}"></th>
                            <th th:replace="~{fragments/table :: th('Categoría')}"></th>
                            <th th:replace="~{fragments/table :: th('Eliminado')}"></th>
                            <th th:replace="~{fragments/table :: th('Eliminado por')}"></th>
                            <th th:replace="~{fragments/table :: thRight('Acciones')}"></th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-gray-200 bg-white">
                        <tr th:each="product : ${products.content}" class="hover:bg-gray-50">
                            <td class="whitespace-nowrap px-6 py-4">
                                <div class="font-medium text-gray-900" th:text="${product.name}"></div>
                            </td>
                            <td class="whitespace-nowrap px-6 py-4">
                                <span th:if="${product.category}"
                                      class="inline-flex items-center rounded-full bg-gray-100 px-2.5 py-0.5 text-xs font-medium text-gray-800"
                                      th:text="${product.category?.name}"></span>
                                <th:block th:unless="${product.category}">
                                    <span th:replace="~{fragments/table :: muted('Sin categoría')}"></span>
                                </th:block>
                            </td>
                            <td class="whitespace-nowrap px-6 py-4 text-sm text-gray-500"
                                th:text="${#temporals.format(product.deletedAt, 'dd/MM/yyyy HH:mm')}"></td>
                            <td class="whitespace-nowrap px-6 py-4 text-sm text-gray-500"
                                th:text="${product.deletedBy?.fullName} ?: 'Desconocido'"></td>
                            <td class="whitespace-nowrap px-6 py-4 text-right">
                                <div class="flex items-center justify-end gap-2">
                                    <form th:replace="~{fragments/buttons :: pill(
                                            '/products/' + ${product.id} + '/restore', null,
                                            'Restaurar', 'restore', 'safe')}"></form>
                                    <form th:replace="~{fragments/buttons :: pill(
                                            '/products/' + ${product.id} + '/hard-delete',
                                            '¿Eliminar PERMANENTEMENTE este producto? Esta acción no se puede deshacer.',
                                            'Eliminar', 'trash', 'danger')}"></form>
                                </div>
                            </td>
                        </tr>

                        <tr th:replace="~{fragments/table :: emptyRow(${products.content}, 5, 'trash',
                                'La papelera está vacía',
                                'Los productos que elimines aparecerán acá y podrás restaurarlos.',
                                null, null, null)}"></tr>
                    </tbody>
                </table>
            </div>

            <div th:replace="~{fragments/pagination :: bar(
                    ${products}, '/products/deleted', 'productos', null)}"></div>
        </div>
    </div>
</body>

</html>
