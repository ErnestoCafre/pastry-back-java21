<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/main}">

<!--/*
  Tags de un producto. Mismo patrón que tags/products: dos paneles, asignados y
  disponibles. Ver esa plantilla para el detalle de por qué salieron el <h1>
  propio y el botón "Volver".
*/-->

<head>
    <title th:text="${pageTitle}">Tags del Producto</title>
</head>

<body>
    <div layout:fragment="content">

        <th:block th:replace="~{fragments/alerts :: flash(${success}, ${error})}"></th:block>

        <nav th:replace="~{fragments/breadcrumb :: trailDeep(
                'Productos', '/products', ${product.name}, '/products/' + ${product.id}, 'Tags')}"></nav>

        <div class="grid grid-cols-1 gap-6 lg:grid-cols-2">

            <div class="overflow-hidden rounded-xl border border-gray-200 bg-white shadow-sm">
                <div class="border-b border-gray-200 bg-gray-50 px-6 py-4">
                    <h2 class="text-lg font-semibold text-gray-900">Tags asignados</h2>
                    <p class="text-sm text-gray-500" th:text="${#lists.size(tags)} + ' tag(s)'"></p>
                </div>
                <div class="divide-y divide-gray-200">
                    <div th:each="tag : ${tags}"
                         class="flex items-center justify-between px-6 py-4 hover:bg-gray-50">
                        <a th:href="@{/tags/{id}(id=${tag.id})}" class="group inline-flex">
                            <span class="inline-flex items-center gap-2 rounded-full bg-primary-100 px-3 py-1 text-sm font-medium text-primary-800 transition-colors group-hover:bg-primary-200">
                                <svg th:replace="~{fragments/icons :: icon('tag', 'w-4 h-4')}"></svg>
                                <span th:text="${tag.name}"></span>
                            </span>
                        </a>
                        <form th:replace="~{fragments/buttons :: iconSubmit(
                                '/products/' + ${product.id} + '/tags/' + ${tag.id} + '/remove',
                                'x', 'Quitar tag del producto', 'danger',
                                #{confirm.remove.tagFromProduct})}"></form>
                    </div>

                    <div th:if="${#lists.isEmpty(tags)}" class="px-6 py-8">
                        <div th:replace="~{fragments/table :: emptyBody('tag',
                                'Este producto no tiene tags',
                                'Agregá alguno desde el panel de la derecha.',
                                null, null, null)}"></div>
                    </div>
                </div>
            </div>

            <div class="overflow-hidden rounded-xl border border-gray-200 bg-white shadow-sm">
                <div class="border-b border-gray-200 bg-gray-50 px-6 py-4">
                    <h2 class="text-lg font-semibold text-gray-900">Agregar tag</h2>
                    <p class="text-sm text-gray-500" th:text="${#lists.size(availableTags)} + ' disponible(s)'"></p>
                </div>
                <div class="max-h-96 divide-y divide-gray-200 overflow-y-auto">
                    <div th:each="tag : ${availableTags}"
                         class="flex items-center justify-between px-6 py-4 hover:bg-gray-50">
                        <span class="inline-flex items-center gap-2 rounded-full bg-gray-100 px-3 py-1 text-sm font-medium text-gray-700">
                            <svg th:replace="~{fragments/icons :: icon('tag', 'w-4 h-4')}"></svg>
                            <span th:text="${tag.name}"></span>
                        </span>
                        <form th:replace="~{fragments/buttons :: iconSubmit(
                                '/products/' + ${product.id} + '/tags/' + ${tag.id},
                                'plus', 'Agregar tag al producto', 'success', null)}"></form>
                    </div>

                    <div th:if="${#lists.isEmpty(availableTags)}" class="px-6 py-8">
                        <div th:replace="~{fragments/table :: emptyBody('check-circle',
                                'Este producto ya tiene todos los tags',
                                null, null, null, null)}"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
