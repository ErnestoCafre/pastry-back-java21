<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/main}">

<!--/*
  Ficha de producto. El "Volver al listado" del pie salió (ver categories/show).

  Es la ficha que sostiene el modelo de acciones de fila: al unificar los
  listados, Receta y Tags salieron de la fila porque son sub-recursos y no
  cosas que se le hagan al producto. Siguen entrando por acá, que es donde
  corresponde y donde ya estaban.
*/-->

<head>
    <title th:text="${pageTitle}">Detalle del Producto</title>
</head>

<body>
    <div layout:fragment="content">

        <th:block th:replace="~{fragments/alerts :: flash(${success}, ${error})}"></th:block>

        <nav th:replace="~{fragments/breadcrumb :: trail('Productos', '/products', ${product.name})}"></nav>

        <div class="max-w-3xl overflow-hidden rounded-xl border border-gray-200 bg-white shadow-sm">
            <div th:if="${product.imageUrl != null}" class="h-64 w-full overflow-hidden bg-gray-100">
                <img th:src="${product.imageUrl}" th:alt="${product.name}" class="h-full w-full object-cover">
            </div>
            <div th:if="${product.imageUrl == null}"
                 class="flex h-40 w-full items-center justify-center bg-gray-100 text-gray-300">
                <svg th:replace="~{fragments/icons :: icon('image', 'w-16 h-16')}"></svg>
            </div>

            <div class="p-6">
                <div class="mb-6 flex items-start justify-between gap-4">
                    <div>
                        <h2 class="text-2xl font-bold text-gray-900" th:text="${product.name}"></h2>
                        <div class="mt-2 flex flex-wrap items-center gap-2">
                            <span th:if="${product.category}"
                                  class="inline-flex items-center rounded-full bg-primary-100 px-3 py-1 text-sm font-medium text-primary-800"
                                  th:text="${product.category?.name}"></span>
                            <span th:each="tag : ${productTags}"
                                  class="inline-flex items-center gap-1 rounded-full bg-gray-100 px-2.5 py-0.5 text-xs font-medium text-gray-700">
                                <svg th:replace="~{fragments/icons :: icon('tag', 'w-3 h-3')}"></svg>
                                <span th:text="${tag.name}"></span>
                            </span>
                        </div>
                    </div>
                    <div class="flex-shrink-0 text-right">
                        <div th:if="${product.basePrice}" class="text-3xl font-bold text-gray-900"
                             th:text="${@money.format(product.basePrice)}"></div>
                        <th:block th:unless="${product.basePrice}">
                            <span th:replace="~{fragments/table :: muted('Sin precio')}"></span>
                        </th:block>
                    </div>
                </div>

                <p th:if="${product.description}" class="mb-6 text-gray-600" th:text="${product.description}"></p>

                <dl class="grid grid-cols-1 gap-4 sm:grid-cols-2">
                    <div class="rounded-lg bg-gray-50 p-4">
                        <dt class="text-sm font-medium text-gray-500">Días de Preparación</dt>
                        <dd class="mt-1 text-lg font-semibold text-gray-900"
                            th:text="${product.preparationDays} ?: 'No especificado'"></dd>
                    </div>
                    <div class="rounded-lg bg-gray-50 p-4">
                        <dt class="text-sm font-medium text-gray-500">Creado por</dt>
                        <dd class="mt-1 text-lg font-semibold text-gray-900"
                            th:text="${product.createdBy?.fullName} ?: 'Desconocido'"></dd>
                    </div>
                    <div class="rounded-lg bg-gray-50 p-4">
                        <dt class="text-sm font-medium text-gray-500">Fecha de creación</dt>
                        <dd class="mt-1 text-lg font-semibold text-gray-900"
                            th:text="${#temporals.format(product.insertedAt, 'dd/MM/yyyy HH:mm')}"></dd>
                    </div>
                    <div class="rounded-lg bg-gray-50 p-4">
                        <dt class="text-sm font-medium text-gray-500">Última actualización</dt>
                        <dd class="mt-1 text-lg font-semibold text-gray-900"
                            th:text="${#temporals.format(product.updatedAt, 'dd/MM/yyyy HH:mm')}"></dd>
                    </div>
                </dl>
            </div>

            <div class="flex flex-wrap justify-end gap-2 border-t border-gray-200 bg-gray-50 px-6 py-4">
                <a th:replace="~{fragments/buttons :: link(
                        '/products/' + ${product.id} + '/tags', 'Tags', 'tag', 'secondary')}"></a>
                <a th:replace="~{fragments/buttons :: link(
                        '/products/' + ${product.id} + '/recipe', 'Receta', 'clipboard', 'secondary')}"></a>
                <a th:replace="~{fragments/buttons :: link(
                        '/products/' + ${product.id} + '/edit', 'Editar', 'pencil', 'primary')}"></a>
                <form th:replace="~{fragments/buttons :: action(
                        '/products/' + ${product.id} + '/delete',
                        '¿Eliminar este producto? Se moverá a la papelera.',
                        'Eliminar', 'trash', 'danger')}"></form>
            </div>
        </div>
    </div>
</body>

</html>
