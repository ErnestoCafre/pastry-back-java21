<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    xmlns:sec="http://www.thymeleaf.org/extras/spring-security" layout:decorate="~{layout/main}">

<!--/*
  Acciones de fila: Ver, Editar y Borrar, como el resto del panel.

  Antes eran Ver, Receta y Tags —sin Editar y sin Borrar—, así que este era el
  único listado desde el que no se podía editar: había que entrar al detalle
  aunque /products/{id}/edit existiera. Receta y Tags no son cosas que se le
  hagan al producto, son sub-recursos, y siguen alcanzables desde la ficha, que
  ya enlazaba a las dos.

  No usa toolbar :: listBar porque suma un filtro por categoría al buscador, y
  listBar arma un formulario de un solo campo. El <select> del filtro tampoco
  puede usar form :: select: ese átomo va con th:field, que necesita un objeto
  de formulario detrás, y un filtro es un parámetro suelto de la petición.
*/-->

<head>
    <title th:text="${pageTitle}">Productos</title>
</head>

<body>
    <div layout:fragment="content" th:with="filtered=${!#strings.isEmpty(search) or categoryId != null}">

        <th:block th:replace="~{fragments/alerts :: flash(${success}, ${error})}"></th:block>

        <div class="mb-6 flex flex-col gap-4 lg:flex-row lg:items-end lg:justify-between">
            <form th:action="@{/products}" method="get" class="flex flex-1 flex-col gap-3 sm:flex-row sm:items-end">
                <div th:replace="~{fragments/form :: searchField(
                        'search', 'search', 'Buscar productos...', ${search})}"></div>

                <div>
                    <label for="categoryId" class="mb-1 block text-xs font-medium text-gray-500">Categoría</label>
                    <select id="categoryId" name="categoryId"
                            class="rounded-lg border border-gray-300 bg-white px-4 py-2 focus:border-primary-500 focus:ring-primary-500">
                        <option value="">Todas las categorías</option>
                        <option th:each="category : ${categories.content}" th:value="${category.id}"
                                th:text="${category.name}" th:selected="${categoryId == category.id}"></option>
                    </select>
                </div>

                <button th:replace="~{fragments/buttons :: submit('Filtrar', 'secondary')}"></button>
            </form>

            <div class="flex items-center gap-2">
                <a th:href="@{/products/deleted}" sec:authorize="hasRole('ADMIN')"
                   class="inline-flex items-center gap-2 rounded-lg border border-gray-300 bg-white px-4 py-2 text-gray-700 transition-colors hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-gray-400 focus:ring-offset-2">
                    <svg th:replace="~{fragments/icons :: icon('trash', 'w-5 h-5')}"></svg>
                    <span>Papelera</span>
                </a>
                <a th:replace="~{fragments/buttons :: link('/products/new', 'Nuevo Producto', 'plus', 'primary')}"></a>
            </div>
        </div>

        <div th:if="${filtered}" class="mb-4 flex flex-wrap items-center gap-2">
            <span class="text-sm text-gray-500">Filtros activos:</span>
            <span th:if="${!#strings.isEmpty(search)}"
                  class="inline-flex items-center gap-1 rounded-full bg-primary-100 px-3 py-1 text-sm text-primary-700">
                <span th:text="'Búsqueda: ' + ${search}"></span>
                <a th:href="@{/products(categoryId=${categoryId})}" title="Quitar el filtro de búsqueda"
                   class="transition-colors hover:text-primary-900">
                    <svg th:replace="~{fragments/icons :: icon('x', 'w-4 h-4')}"></svg>
                    <span class="sr-only">Quitar el filtro de búsqueda</span>
                </a>
            </span>
            <span th:if="${categoryId != null}"
                  class="inline-flex items-center gap-1 rounded-full bg-primary-100 px-3 py-1 text-sm text-primary-700">
                <span th:text="'Categoría: ' + (${categories.content.?[id == __${categoryId}__].empty}
                        ? 'Desconocida'
                        : ${categories.content.?[id == __${categoryId}__][0].name})"></span>
                <a th:href="@{/products(search=${search})}" title="Quitar el filtro de categoría"
                   class="transition-colors hover:text-primary-900">
                    <svg th:replace="~{fragments/icons :: icon('x', 'w-4 h-4')}"></svg>
                    <span class="sr-only">Quitar el filtro de categoría</span>
                </a>
            </span>
            <a th:href="@{/products}" class="text-sm text-gray-500 underline transition-colors hover:text-gray-700">
                Limpiar filtros
            </a>
        </div>

        <div class="overflow-hidden rounded-xl border border-gray-200 bg-white shadow-sm">
            <div class="overflow-x-auto">
                <table class="min-w-full divide-y divide-gray-200">
                    <caption class="sr-only">Listado de productos</caption>
                    <thead class="bg-gray-50">
                        <tr>
                            <th th:replace="~{fragments/table :: th('Producto')}"></th>
                            <th th:replace="~{fragments/table :: th('Categoría')}"></th>
                            <th th:replace="~{fragments/table :: th('Precio')}"></th>
                            <th th:replace="~{fragments/table :: th('Actualización')}"></th>
                            <th th:replace="~{fragments/table :: thRight('Acciones')}"></th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-gray-200 bg-white">
                        <tr th:each="product : ${products.content}" class="hover:bg-gray-50">
                            <td class="px-6 py-4">
                                <div class="flex items-center gap-3">
                                    <div class="h-12 w-12 flex-shrink-0 overflow-hidden rounded-lg bg-primary-100">
                                        <img th:if="${product.imageUrl != null}" th:src="${product.imageUrl}"
                                             th:alt="${product.name}" class="h-full w-full object-cover">
                                        <div th:if="${product.imageUrl == null}"
                                             class="flex h-full w-full items-center justify-center text-primary-600">
                                            <svg th:replace="~{fragments/icons :: icon('image', 'w-5 h-5')}"></svg>
                                        </div>
                                    </div>
                                    <div class="min-w-0">
                                        <a th:href="@{/products/{id}(id=${product.id})}"
                                           class="font-medium text-gray-900 transition-colors hover:text-primary-600"
                                           th:text="${product.name}"></a>
                                        <p class="max-w-xs truncate text-sm text-gray-500"
                                           th:text="${product.description} ?: '—'"></p>
                                    </div>
                                </div>
                            </td>
                            <td class="whitespace-nowrap px-6 py-4">
                                <span th:if="${product.category != null}"
                                      class="inline-flex items-center rounded-full bg-gray-100 px-2.5 py-0.5 text-xs font-medium text-gray-800"
                                      th:text="${product.category?.name}"></span>
                                <!--/* El th:if va afuera del th:replace: juntos, la condición no se
                                       evalúa (th:replace precede 100, th:if 300). */-->
                                <th:block th:if="${product.category == null}">
                                    <span th:replace="~{fragments/table :: muted('Sin categoría')}"></span>
                                </th:block>
                            </td>
                            <td class="whitespace-nowrap px-6 py-4">
                                <span th:if="${product.basePrice != null}" class="text-sm font-semibold text-gray-900"
                                      th:text="${@money.format(product.basePrice)}"></span>
                                <th:block th:if="${product.basePrice == null}">
                                    <span th:replace="~{fragments/table :: muted('Sin precio')}"></span>
                                </th:block>
                            </td>
                            <td class="whitespace-nowrap px-6 py-4">
                                <div th:if="${product.updatedAt != null}" class="flex items-center gap-1">
                                    <svg th:replace="~{fragments/icons :: icon('calendar', 'w-4 h-4 text-gray-400')}"></svg>
                                    <span class="text-sm text-gray-600"
                                          th:text="${#temporals.format(product.updatedAt, 'dd/MM/yyyy HH:mm')}"></span>
                                </div>
                                <span th:if="${product.updatedAt == null}" class="text-sm text-gray-400">—</span>
                            </td>
                            <td class="whitespace-nowrap px-6 py-4 text-right text-sm">
                                <div class="flex items-center justify-end gap-1">
                                    <a th:replace="~{fragments/buttons :: iconLink(
                                            '/products/' + ${product.id}, 'eye', 'Ver producto', 'neutral')}"></a>
                                    <a th:replace="~{fragments/buttons :: iconLink(
                                            '/products/' + ${product.id} + '/edit', 'pencil', 'Editar producto', 'edit')}"></a>
                                    <form th:replace="~{fragments/buttons :: iconDelete(
                                            '/products/' + ${product.id} + '/delete',
                                            '¿Eliminar este producto? Se moverá a la papelera.',
                                            'Eliminar producto')}"></form>
                                </div>
                            </td>
                        </tr>

                        <tr th:replace="~{fragments/table :: emptyRow(${products.content}, 5, 'box',
                                ${filtered} ? 'Sin resultados' : 'No hay productos',
                                'Aún no hay productos registrados en el sistema.',
                                '/products/new', 'Crear primer producto',
                                ${filtered} ? '/products' : null)}"></tr>
                    </tbody>
                </table>
            </div>

            <div th:replace="~{fragments/pagination :: bar(${products}, '/products', 'productos',
                    ${ {'search': search, 'categoryId': categoryId} })}"></div>
        </div>
    </div>
</body>

</html>
