<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/main}">

<!--/*
  Alta y edición de producto. Reemplaza a products/create.html y
  products/edit.html.

  Además del th:action y la etiqueta del botón, el par divergía en dos cosas
  que son justamente el síntoma de mantener copias: la versión de alta tenía
  placeholders en cuatro campos y la de edición los había perdido, y la vista
  previa de la imagen arrancaba oculta en una y visible en la otra.

  Ahora el estado inicial de la vista previa sale de product.imageUrl, que es
  null en el alta: una sola regla cubre los dos casos en vez de dos markups.

  El JS de la vista previa se fue a /js/product-form.js. Antes eran un oninput
  larguísimo en el campo y un onerror en la <img>; los manejadores inline
  necesitan una CSP tan permisiva como los <script> embebidos.
*/-->

<head>
    <title th:text="${pageTitle}">Producto</title>
</head>

<body>
    <div layout:fragment="content" th:with="editing=${productId != null}">

        <nav th:replace="~{fragments/breadcrumb :: trail('Productos', '/products',
                ${editing} ? 'Editar' : 'Nuevo')}"></nav>

        <div class="max-w-2xl rounded-xl border border-gray-200 bg-white p-6 shadow-sm">
            <div th:replace="~{fragments/alerts :: errorBox(${error})}"></div>

            <form th:action="${editing} ? @{/products/{id}(id=${productId})} : @{/products}"
                  th:object="${product}" method="post" class="space-y-6">
                <div th:replace="~{fragments/alerts :: formErrors}"></div>

                <div class="grid grid-cols-1 gap-6 md:grid-cols-2">
                    <div class="md:col-span-2">
                        <div th:replace="~{fragments/form :: text(
                                'name', 'Nombre', true, 'Nombre del producto', null)}"></div>
                    </div>

                    <div class="md:col-span-2">
                        <div th:replace="~{fragments/form :: textarea(
                                'description', 'Descripción', false, 'Descripción del producto')}"></div>
                    </div>

                    <div th:replace="~{fragments/form :: number(
                            'basePrice', 'Precio Base', false, '0.00', '$', '0.01', '0')}"></div>

                    <div th:replace="~{fragments/form :: number(
                            'preparationDays', 'Días de Preparación', false, '0', null, '1', '0')}"></div>

                    <div class="md:col-span-2">
                        <div th:replace="~{fragments/form :: select('categoryId', 'Categoría', false,
                                ${categories.content}, 'id', 'name', #{empty.category})}"></div>
                    </div>

                    <div class="md:col-span-2">
                        <div th:replace="~{fragments/form :: text('imageUrl', 'Imagen del Producto', false,
                                '/images/products/mi-producto.webp', null)}"></div>
                        <p class="mt-1 text-xs text-gray-500">
                            Ruta relativa de la imagen (ej: /images/products/nombre.webp)
                        </p>

                        <div id="imagePreviewContainer" class="mt-3"
                             th:classappend="${product.imageUrl == null} ? 'hidden' : ''">
                            <p class="mb-1 text-sm text-gray-500">Vista previa:</p>
                            <div class="h-36 w-48 overflow-hidden rounded-lg border border-gray-200 bg-gray-50">
                                <img id="imagePreview" th:src="${product.imageUrl}" alt="Vista previa"
                                     class="h-full w-full object-cover">
                            </div>
                        </div>
                    </div>
                </div>

                <div th:replace="~{fragments/form :: actions(
                        ${editing} ? 'Actualizar Producto' : 'Guardar Producto', '/products')}"></div>
            </form>
        </div>
    </div>

    <th:block layout:fragment="scripts">
        <script th:src="@{/js/product-form.js}" defer></script>
    </th:block>
</body>

</html>
