<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/main}">

<head>
    <title th:text="${pageTitle}">Receta del Producto</title>
</head>

<body>
    <div layout:fragment="content">
        <nav th:replace="~{fragments/breadcrumb :: trailDeep(
                'Productos', '/products', ${product.name},
                '/products/' + ${product.id}, 'Receta')}"></nav>

        <th:block th:replace="~{fragments/alerts :: flash(${success}, ${error})}"></th:block>

        <!-- Header -->
        <div class="flex items-center justify-between mb-6">
            <div class="flex items-center gap-3">
                <div class="flex-shrink-0 w-12 h-12 bg-amber-100 rounded-lg flex items-center justify-center">
                    <svg class="w-6 h-6 text-amber-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01" />
                    </svg>
                </div>
                <!--/* El <h1> con el nombre del producto salió: el layout ya dibuja uno
                       con pageTitle ("Receta: X"), así que la página tenía dos y un
                       lector de pantalla anunciaba dos títulos de nivel 1. El
                       "Volver a Productos" también, porque la miga ya vuelve. */-->
                <p class="text-sm text-gray-500">Gestionar receta (ingredientes)</p>
            </div>
            <div class="rounded-lg border border-green-200 bg-green-50 px-4 py-2">
                <span class="text-sm text-green-700">Costo receta: </span>
                <span class="font-semibold text-green-800" th:text="${@money.format(recipeCost)}">$0,00</span>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
            <!-- Ingredientes en la receta -->
            <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
                <div class="px-6 py-4 bg-gray-50 border-b border-gray-200">
                    <h2 class="text-lg font-semibold text-gray-900">Ingredientes en la receta</h2>
                    <p class="text-sm text-gray-500" th:text="${#lists.size(ingredients) + ' ingrediente(s)'}"></p>
                </div>
                <div class="divide-y divide-gray-200">
                    <div th:each="pi : ${ingredients}"
                        class="px-6 py-4 hover:bg-gray-50">
                        <div class="flex items-center justify-between">
                            <div class="flex-1">
                                <div class="flex items-center gap-2">
                                    <span class="font-medium text-gray-900" th:text="${pi.ingredient.name}"></span>
                                    <span class="text-xs px-2 py-0.5 bg-gray-100 text-gray-600 rounded"
                                        th:text="${pi.ingredient.unitOfMeasure}"></span>
                                </div>
                                <div class="mt-1 text-sm text-gray-500">
                                    <span>Cantidad: </span>
                                    <span class="font-medium" th:text="${@money.quantity(pi.quantity)}"></span>
                                    <span class="mx-2">|</span>
                                    <span>Costo unitario: </span>
                                    <span th:text="${@money.format(pi.ingredient.unitCost)}"></span>
                                    <span class="mx-2">|</span>
                                    <span>Subtotal: </span>
                                    <span class="font-medium text-green-600"
                                        th:text="${@money.format(pi.quantity * pi.ingredient.unitCost)}"></span>
                                </div>
                            </div>
                            <div class="flex items-center gap-1">
                                <!-- Editar cantidad -->
                                <!--/* data-action lo arma Thymeleaf con @{...}, no el JS concatenando
                                     '/products/' + id: así la URL respeta el context-path. */-->
                                <button type="button"
                                    class="p-2 text-blue-600 hover:bg-blue-50 rounded-lg transition-colors edit-btn"
                                    title="Editar cantidad"
                                    th:data-action="@{/products/{productId}/recipe/ingredients/{ingredientId}/update(productId=${product.id}, ingredientId=${pi.ingredient.id})}"
                                    th:data-ingredient-name="${pi.ingredient.name}"
                                    th:data-quantity="${pi.quantity}"
                                    th:data-unit="${pi.ingredient.unitOfMeasure}">
                                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                            d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" />
                                    </svg>
                                </button>
                                <!-- Quitar ingrediente -->
                                <form th:action="@{/products/{productId}/recipe/ingredients/{ingredientId}/remove(productId=${product.id}, ingredientId=${pi.ingredient.id})}"
                                    method="post"
                                    data-confirm="¿Quitar este ingrediente de la receta?">
                                    <button type="submit"
                                        class="p-2 text-red-600 hover:bg-red-50 rounded-lg transition-colors"
                                        title="Quitar ingrediente">
                                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                                d="M6 18L18 6M6 6l12 12" />
                                        </svg>
                                    </button>
                                </form>
                            </div>
                        </div>
                    </div>
                    <div th:if="${#lists.isEmpty(ingredients)}" class="px-6 py-8 text-center text-gray-500">
                        <svg class="mx-auto h-12 w-12 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2" />
                        </svg>
                        <p class="mt-2">Este producto no tiene ingredientes en su receta</p>
                    </div>
                </div>
            </div>

            <!-- Agregar ingredientes -->
            <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
                <div class="px-6 py-4 bg-gray-50 border-b border-gray-200">
                    <h2 class="text-lg font-semibold text-gray-900">Agregar ingrediente</h2>
                    <p class="text-sm text-gray-500" th:text="${#lists.size(availableIngredients) + ' disponible(s)'}"></p>
                </div>
                <div class="divide-y divide-gray-200 max-h-96 overflow-y-auto">
                    <div th:each="ingredient : ${availableIngredients}"
                        class="px-6 py-4 hover:bg-gray-50">
                        <form th:action="@{/products/{productId}/recipe/ingredients/{ingredientId}(productId=${product.id}, ingredientId=${ingredient.id})}"
                            method="post" class="flex items-center justify-between gap-4">
                            <div class="flex-1 min-w-0">
                                <div class="flex items-center gap-2">
                                    <span class="font-medium text-gray-900 truncate" th:text="${ingredient.name}"></span>
                                    <span class="text-xs px-2 py-0.5 bg-gray-100 text-gray-600 rounded flex-shrink-0"
                                        th:text="${ingredient.unitOfMeasure}"></span>
                                </div>
                                <p class="text-sm text-gray-500"
                                    th:text="${'Costo: ' + @money.format(ingredient.unitCost) + ' por ' + ingredient.unitOfMeasure}"></p>
                            </div>
                            <div class="flex items-center gap-2">
                                <input type="number" name="quantity" step="0.0001" min="0.0001" required
                                    placeholder="Cantidad"
                                    class="w-24 px-3 py-2 text-sm border border-gray-300 rounded-lg focus:ring-primary-500 focus:border-primary-500">
                                <button type="submit"
                                    class="p-2 text-green-600 hover:bg-green-50 rounded-lg transition-colors"
                                    title="Agregar ingrediente">
                                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                            d="M12 4v16m8-8H4" />
                                    </svg>
                                </button>
                            </div>
                        </form>
                    </div>
                    <div th:if="${#lists.isEmpty(availableIngredients)}" class="px-6 py-8 text-center text-gray-500">
                        <svg class="mx-auto h-12 w-12 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
                        </svg>
                        <p class="mt-2">No hay mas ingredientes disponibles</p>
                        <a th:href="@{/ingredients/new}" class="mt-2 inline-block text-primary-600 hover:text-primary-800">
                            Crear nuevo ingrediente
                        </a>
                    </div>
                </div>
            </div>
        </div>

        <!--/*
          Modal para editar cantidad.

          <dialog> nativo abierto con showModal(). El bloque anterior era un
          <div class="hidden"> a mano: sin role="dialog", sin aria-modal, sin
          atrapado del foco (se podía tabular a la página de atrás) y sin
          devolver el foco al botón al cerrar. El elemento nativo trae las
          cuatro cosas, más el overlay como ::backdrop, sin ninguna librería.
        */-->
        <dialog id="editQuantityDialog" aria-labelledby="editQuantityTitle"
            class="w-[calc(100%-2rem)] max-w-lg rounded-lg bg-white p-6 text-left shadow-xl">
            <div class="mb-4">
                <h2 id="editQuantityTitle" class="text-lg font-medium text-gray-900">Editar cantidad</h2>
                <p class="mt-1 text-sm text-gray-500" data-dialog-ingredient></p>
            </div>
            <form id="editQuantityForm" method="post">
                <!--/*
                  El token CSRF va explícito porque este form es el único del
                  panel sin th:action: la URL la fija el JS al abrir el modal,
                  según qué ingrediente se esté editando. Y es justamente
                  th:action lo que dispara el RequestDataValueProcessor de
                  Spring Security que inyecta el hidden en todos los demás.

                  Sin esto el POST salía sin token y la cadena de seguridad del
                  panel lo rechazaba con 403: "editar cantidad" mostraba la
                  página de "Tu sesión expiró" en vez de guardar. Estaba así
                  desde antes de migrar el modal a <dialog>.
                */-->
                <input th:if="${_csrf}" type="hidden"
                    th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <div class="mb-4">
                    <label for="editQuantity" class="block text-sm font-medium text-gray-700">
                        Cantidad (<span data-dialog-unit></span>)
                    </label>
                    <input type="number" name="quantity" id="editQuantity" step="0.0001" min="0.0001" required
                        class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-lg shadow-sm focus:ring-primary-500 focus:border-primary-500">
                </div>
                <div class="flex justify-end gap-3">
                    <button type="button" data-dialog-close
                        class="px-4 py-2 text-sm font-medium text-gray-700 bg-white border border-gray-300 rounded-lg hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-gray-400 focus:ring-offset-2">
                        Cancelar
                    </button>
                    <button type="submit"
                        class="px-4 py-2 text-sm font-medium text-white bg-primary-600 rounded-lg hover:bg-primary-700 focus:outline-none focus:ring-2 focus:ring-primary-500 focus:ring-offset-2">
                        Guardar
                    </button>
                </div>
            </form>
        </dialog>
    </div>

    <!--/* El JS vive en un archivo aparte, no en un <script th:inline>: sin JS
         inline el panel puede servir una CSP sin 'unsafe-inline'. */-->
    <th:block layout:fragment="scripts">
        <script th:src="@{/js/recipe.js}" defer></script>
    </th:block>
</body>

</html>
