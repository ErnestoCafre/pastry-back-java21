<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title layout:title-pattern="$CONTENT_TITLE - Malva Pastry Shop">Malva Pastry Shop</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: {
                            50: '#fdf2f8',
                            100: '#fce7f3',
                            200: '#fbcfe8',
                            300: '#f9a8d4',
                            400: '#f472b6',
                            500: '#ec4899',
                            600: '#db2777',
                            700: '#be185d',
                            800: '#9d174d',
                            900: '#831843',
                        }
                    },
                    animation: {
                        'fadeInUp': 'fadeInUp 0.5s ease-out',
                        'logoFloat': 'logoFloat 2s ease-in-out infinite',
                    },
                    keyframes: {
                        fadeInUp: {
                            '0%': { opacity: '0', transform: 'translateY(20px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        },
                        logoFloat: {
                            '0%, 100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-10px)' },
                        }
                    }
                }
            }
        }
    </script>

    <!-- Flowbite CSS -->
    <link href="https://cdn.jsdelivr.net/npm/flowbite@2.5.2/dist/flowbite.min.css" rel="stylesheet" />
</head>

<body class="bg-gray-50">
    <!-- Mobile Header -->
    <header class="fixed top-0 left-0 right-0 z-40 bg-white border-b border-gray-200 lg:hidden">
        <div class="flex items-center justify-between px-4 py-3">
            <a th:href="@{/dashboard}" class="flex items-center gap-2">
                <span class="text-2xl">🧁</span>
                <span class="font-bold text-xl text-primary-600">Malva Pastry</span>
            </a>
            <button data-drawer-target="sidebar" data-drawer-toggle="sidebar" aria-controls="sidebar"
                class="p-2 text-gray-500 rounded-lg hover:bg-gray-100 focus:outline-none focus:ring-2 focus:ring-gray-200">
                <span class="sr-only">Abrir menú</span>
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
                </svg>
            </button>
        </div>
    </header>

    <!-- Sidebar -->
    <aside id="sidebar"
        class="fixed top-0 left-0 z-50 w-64 h-screen transition-transform -translate-x-full lg:translate-x-0"
        aria-label="Sidebar">
        <div class="h-full flex flex-col bg-gradient-to-b from-primary-600 to-primary-700 shadow-xl">
            <!-- Logo -->
            <div class="flex items-center gap-3 px-6 py-5 border-b border-white/10">
                <span class="text-3xl">🧁</span>
                <div>
                    <span class="font-bold text-xl text-white">Malva Pastry</span>
                    <p class="text-xs text-white/70">Panel de Administración</p>
                </div>
            </div>

            <!-- Navigation -->
            <nav class="flex-1 px-3 py-4 overflow-y-auto">
                <ul class="space-y-1">
                    <li th:replace="~{fragments/nav :: item('dashboard', '/dashboard', 'home', 'Dashboard', ${activeNav})}"></li>

                    <li th:replace="~{fragments/nav :: group('Inventario')}"></li>
                    <li th:replace="~{fragments/nav :: item('products', '/products', 'box', 'Productos', ${activeNav})}"></li>
                    <li th:replace="~{fragments/nav :: item('categories', '/categories', 'folder', 'Categorías', ${activeNav})}"></li>
                    <li th:replace="~{fragments/nav :: item('ingredients', '/ingredients', 'beaker', 'Ingredientes', ${activeNav})}"></li>
                    <li th:replace="~{fragments/nav :: item('sales', '/sales', 'cart', 'Ventas', ${activeNav})}"></li>

                    <li th:replace="~{fragments/nav :: group('Storefront')}"></li>
                    <li th:replace="~{fragments/nav :: item('tags', '/tags', 'tag', 'Tags', ${activeNav})}"></li>
                    <li th:replace="~{fragments/nav :: item('sections', '/sections', 'list', 'Secciones', ${activeNav})}"></li>

                    <!-- sec:authorize va en un envoltorio, NO junto al th:replace:
                         th:replace precede 100 y sec:authorize 300, así que en el
                         mismo elemento el authorize no llegaría a evaluarse y el
                         ítem se vería con cualquier rol. -->
                    <th:block sec:authorize="hasRole('ADMIN')">
                        <li th:replace="~{fragments/nav :: group('Sistema')}"></li>
                        <li th:replace="~{fragments/nav :: item('users', '/users', 'users', 'Usuarios', ${activeNav})}"></li>
                    </th:block>
                </ul>
            </nav>

            <!-- User Section -->
            <div class="px-3 py-4 border-t border-white/10">
                <div class="flex items-center gap-3 px-4 py-3 mb-2">
                    <div aria-hidden="true"
                        class="w-10 h-10 rounded-full bg-white/20 flex items-center justify-center text-white font-bold">
                        <!-- Solo la inicial. Antes este span tenía además
                             sec:authentication="principal.fullName", que con
                             precedencia 1300 se procesa después de th:text (700)
                             y lo pisaba: el círculo de 40px terminaba mostrando
                             el nombre completo. El nombre ya se muestra al lado,
                             así que el avatar es decorativo. -->
                        <span th:text="${#authentication?.principal?.fullName != null
                                        ? #strings.substring(#authentication.principal.fullName, 0, 1)
                                        : '?'}">U</span>
                    </div>
                    <div class="flex-1 min-w-0">
                        <p class="text-sm font-semibold text-white truncate" sec:authentication="principal.fullName">
                            Usuario</p>
                        <p class="text-xs text-white/70 uppercase tracking-wider"
                            sec:authentication="principal.role.name">Rol</p>
                    </div>
                </div>
                <form th:action="@{/logout}" method="post">
                    <button type="submit"
                        class="w-full flex items-center justify-center gap-2 px-4 py-2.5 text-sm font-medium text-white bg-white/10 border border-white/20 rounded-lg hover:bg-white/20 transition-all">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
                        </svg>
                        Cerrar Sesión
                    </button>
                </form>
            </div>
        </div>
    </aside>

    <!-- Backdrop for mobile -->
    <div data-drawer-backdrop="sidebar" class="hidden fixed inset-0 z-40 bg-gray-900/50 lg:hidden"></div>

    <!-- Main Content -->
    <div class="lg:ml-64">
        <main class="min-h-screen pt-16 lg:pt-0">
            <div class="p-4 sm:p-6 lg:p-8">
                <!-- Page Header -->
                <header th:if="${pageTitle}" class="mb-8">
                    <h1 class="text-2xl lg:text-3xl font-bold text-gray-900" th:text="${pageTitle}">Título</h1>
                </header>

                <!-- Page Content -->
                <div layout:fragment="content">
                    <!-- Content will be replaced -->
                </div>
            </div>
        </main>

        <!-- Footer -->
        <footer class="py-4 px-6 text-center text-gray-500 text-sm border-t border-gray-200 bg-white">
            <p>&copy; 2026 Malva Pastry Shop - Panel de Administración</p>
        </footer>
    </div>

    <!-- Flowbite JS -->
    <script src="https://cdn.jsdelivr.net/npm/flowbite@2.5.2/dist/flowbite.min.js"></script>

    <!-- Comportamiento compartido: confirmaciones vía [data-confirm] -->
    <script th:src="@{/js/admin.js}"></script>

    <!-- Additional scripts -->
    <div layout:fragment="scripts">
    </div>
</body>

</html>
