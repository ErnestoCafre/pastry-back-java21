<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<!--
  Barra superior de los listados: búsqueda + papelera + acción primaria.

  Uso:
    <div th:replace="~{fragments/toolbar :: listBar(
           '/tags', 'Buscar tags...', ${search},
           '/tags/deleted', '/tags/new', 'Nuevo Tag')}"></div>

  trashUrl null -> no se muestra la papelera (users no tiene).
  Cuando sí se muestra, queda restringida a ADMIN, que es como estaba en
  products y tags. Antes esa regla se repetía suelta en cada listado, así
  que era fácil olvidarla en uno nuevo.
-->

<body>

<div th:fragment="listBar(searchUrl, searchPlaceholder, searchValue, trashUrl, newUrl, newLabel)"
     class="mb-6 flex flex-col gap-4 sm:flex-row sm:items-center sm:justify-between">

    <form th:replace="~{fragments/form :: search(${searchUrl}, ${searchPlaceholder}, ${searchValue})}"></form>

    <div class="flex items-center gap-2">
        <a th:if="${trashUrl}" sec:authorize="hasRole('ADMIN')" th:href="@{${trashUrl}}"
           class="inline-flex items-center gap-2 rounded-lg border border-gray-300 bg-white px-4 py-2 text-gray-700 transition-colors hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-gray-400 focus:ring-offset-2">
            <svg th:replace="~{fragments/icons :: icon('trash', 'w-5 h-5')}"></svg>
            <span>Papelera</span>
        </a>
        <a th:replace="~{fragments/buttons :: link(${newUrl}, ${newLabel}, 'plus', 'primary')}"></a>
    </div>
</div>

</body>
</html>
