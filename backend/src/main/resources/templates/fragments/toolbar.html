<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<!--
  Barra superior de los listados: búsqueda + papelera + acción primaria.

  Uso:
    <div th:replace="~{fragments/toolbar :: listBar(
           '/tags', 'Buscar tags...', ${search},
           '/tags/deleted', '/tags/new', 'Nuevo Tag')}"></div>

  trashUrl null -> no se muestra la papelera (users no tiene).
  Cuando sí se muestra, queda restringida a ADMIN, que es como estaba en
  products y tags. Antes esa regla se repetía suelta en cada listado, así
  que era fácil olvidarla en uno nuevo.

  El <form> de búsqueda lo pone ESTE fragment, no el campo. Los campos de
  form :: no traen formulario propio justamente para poder convivir con otros
  en una misma barra de filtros (ver sales/list, que tiene tres). Un listado
  con varios filtros no usa listBar: arma su propio <form> y mete adentro los
  campos que necesite.
-->

<body>

<div th:fragment="listBar(searchUrl, searchPlaceholder, searchValue, trashUrl, newUrl, newLabel)"
     class="mb-6 flex flex-col gap-4 sm:flex-row sm:items-center sm:justify-between">

    <!--/* searchUrl null -> sin buscador. users/list lo necesita: tenía una caja
           de búsqueda que no hacía nada, porque UserController.list ni siquiera
           acepta el parámetro. Un control que se puede usar y no produce ningún
           efecto es peor que no tenerlo. Cuando exista búsqueda de usuarios,
           basta con pasarle la URL.

           El envoltorio th:block es obligatorio: con el th:if junto al
           th:replace, la condición no llegaría a evaluarse. */-->
    <th:block th:if="${searchUrl}">
        <form th:action="@{${searchUrl}}" method="get" class="w-full max-w-md">
            <div th:replace="~{fragments/form :: searchField('search', 'search', ${searchPlaceholder}, ${searchValue})}"></div>
        </form>
    </th:block>
    <!--/* Sin buscador, el botón primario igual queda a la derecha. */-->
    <div th:if="${searchUrl == null}" class="hidden sm:block"></div>

    <div class="flex items-center gap-2">
        <a th:if="${trashUrl}" sec:authorize="hasRole('ADMIN')" th:href="@{${trashUrl}}"
           class="inline-flex items-center gap-2 rounded-lg border border-gray-300 bg-white px-4 py-2 text-gray-700 transition-colors hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-gray-400 focus:ring-offset-2">
            <svg th:replace="~{fragments/icons :: icon('trash', 'w-5 h-5')}"></svg>
            <span>Papelera</span>
        </a>
        <a th:replace="~{fragments/buttons :: link(${newUrl}, ${newLabel}, 'plus', 'primary')}"></a>
    </div>
</div>

</body>
</html>
