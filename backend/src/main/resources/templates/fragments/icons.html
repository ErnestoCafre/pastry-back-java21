<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<!--
  Catálogo de iconos. Reemplaza los 224 <svg> inline del proyecto.

  Uso:
    <svg th:replace="~{fragments/icons :: icon('eye', 'w-5 h-5')}"></svg>
    <svg th:replace="~{fragments/icons :: solid('check-circle', 'w-5 h-5')}"></svg>

  Dos familias, porque el proyecto mezcla ambas:
    icon()  -> Heroicons outline, viewBox 0 0 24 24, stroke="currentColor"
    solid() -> Heroicons solid,   viewBox 0 0 20 20, fill="currentColor"

  Los atributos de trazo (stroke-width / linecap / linejoin) viven en el <svg>
  y se heredan a los <path>: son atributos de presentación SVG. Eso saca
  ~3 atributos repetidos de cada uno de los 224 iconos.

  Todos los iconos son decorativos -> aria-hidden="true". Si un icono es la
  única etiqueta de un control, el control necesita su propio texto accesible
  (title / aria-label / <span class="sr-only">), no el icono.
-->

<body>

<svg th:fragment="icon(name, cls)"
     th:class="${cls} ?: 'w-5 h-5'"
     xmlns="http://www.w3.org/2000/svg"
     fill="none" stroke="currentColor" viewBox="0 0 24 24"
     stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
     aria-hidden="true" focusable="false">
    <th:block th:switch="${name}">

        <!--/* Navegación / layout */-->
        <path th:case="'home'"
              d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
        <path th:case="'menu'" d="M4 6h16M4 12h16M4 18h16"/>
        <path th:case="'list'" d="M4 6h16M4 12h16M4 18h7"/>
        <path th:case="'logout'"
              d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
        <path th:case="'users'"
              d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"/>

        <!--/* Entidades del dominio */-->
        <path th:case="'box'" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/>
        <path th:case="'folder'" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"/>
        <path th:case="'beaker'"
              d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z"/>
        <path th:case="'cart'"
              d="M17 9V7a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2m2 4h10a2 2 0 002-2v-6a2 2 0 00-2-2H9a2 2 0 00-2 2v6a2 2 0 002 2zm7-5a2 2 0 11-4 0 2 2 0 014 0z"/>
        <path th:case="'tag'"
              d="M7 7h.01M7 3h5c.512 0 1.024.195 1.414.586l7 7a2 2 0 010 2.828l-7 7a2 2 0 01-2.828 0l-7-7A1.994 1.994 0 013 12V7a4 4 0 014-4z"/>
        <path th:case="'clipboard'"
              d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01"/>
        <path th:case="'clipboard-empty'"
              d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/>

        <!--/* Acciones */-->
        <th:block th:case="'eye'">
            <path d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
            <path d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
        </th:block>
        <path th:case="'pencil'"
              d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/>
        <path th:case="'trash'"
              d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
        <path th:case="'plus'" d="M12 4v16m8-8H4"/>
        <path th:case="'x'" d="M6 18L18 6M6 6l12 12"/>
        <path th:case="'restore'"
              d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
        <path th:case="'search'" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>

        <!--/* Direccionales */-->
        <path th:case="'chevron-left'" d="M15 19l-7-7 7-7"/>
        <path th:case="'chevron-right'" d="M9 5l7 7-7 7"/>
        <path th:case="'arrow-left'" d="M10 19l-7-7m0 0l7-7m-7 7h18"/>

        <!--/* Estado */-->
        <path th:case="'calendar'" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/>
        <path th:case="'check-circle'" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
        <path th:case="'ban'"
              d="M18.364 18.364A9 9 0 005.636 5.636m12.728 12.728A9 9 0 015.636 5.636m12.728 12.728L5.636 5.636"/>
        <path th:case="'image'"
              stroke-width="1.5"
              d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/>

        <!--/* Fallback visible en desarrollo: un icono mal escrito no debe pasar desapercibido */-->
        <path th:case="*" d="M12 9v2m0 4h.01M5 19h14a2 2 0 001.84-2.75L13.74 4a2 2 0 00-3.48 0l-7.1 12.25A2 2 0 004.99 19z"/>
    </th:block>
</svg>


<svg th:fragment="solid(name, cls)"
     th:class="${cls} ?: 'w-5 h-5'"
     xmlns="http://www.w3.org/2000/svg"
     fill="currentColor" viewBox="0 0 20 20"
     aria-hidden="true" focusable="false">
    <th:block th:switch="${name}">
        <path th:case="'check-circle'" fill-rule="evenodd" clip-rule="evenodd"
              d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z"/>
        <path th:case="'x-circle'" fill-rule="evenodd" clip-rule="evenodd"
              d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z"/>
        <path th:case="'chevron-right'" fill-rule="evenodd" clip-rule="evenodd"
              d="M7.293 14.707a1 1 0 010-1.414L10.586 10 7.293 6.707a1 1 0 011.414-1.414l4 4a1 1 0 010 1.414l-4 4a1 1 0 01-1.414 0z"/>
        <path th:case="*" fill-rule="evenodd" clip-rule="evenodd"
              d="M8.257 3.099c.765-1.36 2.722-1.36 3.486 0l5.58 9.92c.75 1.334-.213 2.98-1.742 2.98H4.42c-1.53 0-2.493-1.646-1.743-2.98l5.58-9.92zM11 13a1 1 0 11-2 0 1 1 0 012 0zm-1-8a1 1 0 00-1 1v3a1 1 0 002 0V6a1 1 0 00-1-1z"/>
    </th:block>
</svg>

</body>
</html>
