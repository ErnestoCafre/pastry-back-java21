<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<!--
  Migas de pan. Reemplaza 24 copias del mismo bloque de ~13 líneas.

  Uso (2 niveles — el 95% de los casos):
    <nav th:replace="~{fragments/breadcrumb :: trail('Productos', '/products', 'Nuevo')}"></nav>

  Uso (3 niveles — p.ej. Productos › Torta › Receta):
    <nav th:replace="~{fragments/breadcrumb :: trailDeep(
           'Productos', '/products', ${product.name}, '/products/' + ${product.id}, 'Receta')}"></nav>

  Accesibilidad:
    - <nav aria-label="Migas de pan"> identifica la región.
    - aria-current="page" en el último item: es la práctica estándar para
      marcar "estás acá" (MDN / W3C Design System). Antes no existía en
      ninguna parte del proyecto.
    - Los separadores son aria-hidden: son decoración, no contenido.
-->

<body>

<nav th:fragment="trail(parentLabel, parentUrl, current)" class="mb-6" aria-label="Migas de pan">
    <ol class="flex flex-wrap items-center gap-1 text-sm">
        <li>
            <a th:href="@{${parentUrl}}" th:text="${parentLabel}"
               class="text-gray-500 transition-colors hover:text-primary-600 hover:underline">Sección</a>
        </li>
        <li class="flex items-center gap-1">
            <svg th:replace="~{fragments/icons :: solid('chevron-right', 'w-4 h-4 text-gray-400')}"></svg>
            <span class="font-medium text-gray-700" th:text="${current}" aria-current="page">Actual</span>
        </li>
    </ol>
</nav>


<!-- SIN USO TODAVÍA: preparado para la migración pendiente, no lo cubre
     FragmentRenderingTest. Verificalo al migrar el primer template que lo use. -->
<nav th:fragment="trailDeep(parentLabel, parentUrl, midLabel, midUrl, current)" class="mb-6"
     aria-label="Migas de pan">
    <ol class="flex flex-wrap items-center gap-1 text-sm">
        <li>
            <a th:href="@{${parentUrl}}" th:text="${parentLabel}"
               class="text-gray-500 transition-colors hover:text-primary-600 hover:underline">Sección</a>
        </li>
        <li class="flex items-center gap-1">
            <svg th:replace="~{fragments/icons :: solid('chevron-right', 'w-4 h-4 text-gray-400')}"></svg>
            <a th:href="@{${midUrl}}" th:text="${midLabel}"
               class="text-gray-500 transition-colors hover:text-primary-600 hover:underline">Elemento</a>
        </li>
        <li class="flex items-center gap-1">
            <svg th:replace="~{fragments/icons :: solid('chevron-right', 'w-4 h-4 text-gray-400')}"></svg>
            <span class="font-medium text-gray-700" th:text="${current}" aria-current="page">Actual</span>
        </li>
    </ol>
</nav>


<!--
  Enlace de retorno simple, para las páginas de papelera que hoy usan
  "Volver a X" en lugar de migas. Un solo componente para las dos formas
  de volver que conviven en el panel.
-->
<div th:fragment="back(label, url)" class="mb-6">
    <a th:href="@{${url}}"
       class="inline-flex items-center gap-2 text-sm text-gray-500 transition-colors hover:text-primary-600">
        <svg th:replace="~{fragments/icons :: icon('arrow-left', 'w-5 h-5')}"></svg>
        <span th:text="${label}">Volver</span>
    </a>
</div>

</body>
</html>
