<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<!--
  Átomos de formulario. Reemplazaron ~45 bloques label+input+error copiados
  a mano y permitieron fusionar los 6 pares create/edit: 12 archivos y 1.083
  líneas pasaron a 6 archivos y 412, con el modo elegido según el controller
  publique o no el id de la entidad.

  Uso — deben llamarse DENTRO del <form th:object="...">, porque th:field
  se resuelve contra ese objeto:

    <form th:action="@{/categories}" th:object="${category}" method="post" class="space-y-6">
        <div th:replace="~{fragments/alerts :: formErrors}"></div>
        <div th:replace="~{fragments/form :: text('name', 'Nombre', true,
                            'Ej: Tortas, Galletas', null)}"></div>
        <div th:replace="~{fragments/form :: textarea('description', 'Descripción', false,
                            'Descripción opcional')}"></div>
        <div th:replace="~{fragments/form :: actions('Guardar Categoría', '/categories')}"></div>
    </form>

  Cómo funciona el nombre de campo dinámico:
    th:field="*{__${field}__}" — el __${...}__ es preprocesamiento: Thymeleaf
    sustituye el texto ANTES de parsear la expresión, así que *{__${field}__}
    con field='name' se convierte literalmente en *{name}. Es la forma
    soportada de parametrizar th:field desde un fragment.

  Tres mejoras que quedan aplicadas por construcción:
    - th:errorclass en lugar del th:classappend="${#fields.hasErrors('x')} ? ..."
      manual que había repetido en cada campo.
    - aria-invalid + aria-describedby enlazando el input con su mensaje de
      error (WCAG 3.3.1). No existía en ningún formulario.
    - El asterisco de obligatorio es aria-hidden: quien usa lector de
      pantalla ya recibe la condición por el atributo `required`, y si no
      se oculta escucha "asterisco" en cada campo.
-->

<body>

<!-- ---------- Campos ---------- -->

<div th:fragment="text(field, label, required, placeholder, type)">
    <label th:for="${field}" class="mb-1 block text-sm font-medium text-gray-700">
        <span th:text="${label}">Etiqueta</span>
        <span th:if="${required}" class="text-red-500" aria-hidden="true">*</span>
    </label>
    <input th:type="${type} ?: 'text'" th:id="${field}" th:field="*{__${field}__}"
           th:required="${required}" th:placeholder="${placeholder}"
           th:errorclass="border-red-500 focus:border-red-500 focus:ring-red-500"
           th:aria-invalid="${#fields.hasErrors(field)} ? 'true' : null"
           th:aria-describedby="${#fields.hasErrors(field)} ? ${field} + '-error' : null"
           class="w-full rounded-lg border border-gray-300 px-4 py-2 focus:border-primary-500 focus:ring-primary-500">
    <p th:if="${#fields.hasErrors(field)}" th:id="${field} + '-error'"
       class="mt-1 text-sm text-red-600" th:errors="*{__${field}__}"></p>
</div>


<!-- Numérico con prefijo (precios, costos). step/min como texto: '0.01', '0'.
     Lo usan sections (displayOrder), ingredients (unitCost) y products
     (basePrice, preparationDays). -->
<div th:fragment="number(field, label, required, placeholder, prefix, step, min)">
    <label th:for="${field}" class="mb-1 block text-sm font-medium text-gray-700">
        <span th:text="${label}">Etiqueta</span>
        <span th:if="${required}" class="text-red-500" aria-hidden="true">*</span>
    </label>
    <div class="relative">
        <span th:if="${prefix}" th:text="${prefix}" aria-hidden="true"
              class="pointer-events-none absolute left-3 top-1/2 -translate-y-1/2 text-gray-500">$</span>
        <input type="number" th:id="${field}" th:field="*{__${field}__}"
               th:required="${required}" th:placeholder="${placeholder}"
               th:step="${step}" th:min="${min}"
               th:errorclass="border-red-500 focus:border-red-500 focus:ring-red-500"
               th:aria-invalid="${#fields.hasErrors(field)} ? 'true' : null"
               th:aria-describedby="${#fields.hasErrors(field)} ? ${field} + '-error' : null"
               th:class="'w-full rounded-lg border border-gray-300 py-2 pr-4 focus:border-primary-500 focus:ring-primary-500 ' +
                         (${prefix} ? 'pl-8' : 'pl-4')">
    </div>
    <p th:if="${#fields.hasErrors(field)}" th:id="${field} + '-error'"
       class="mt-1 text-sm text-red-600" th:errors="*{__${field}__}"></p>
</div>


<div th:fragment="textarea(field, label, required, placeholder)">
    <label th:for="${field}" class="mb-1 block text-sm font-medium text-gray-700">
        <span th:text="${label}">Etiqueta</span>
        <span th:if="${required}" class="text-red-500" aria-hidden="true">*</span>
    </label>
    <textarea th:id="${field}" th:field="*{__${field}__}" rows="3"
              th:required="${required}" th:placeholder="${placeholder}"
              th:errorclass="border-red-500 focus:border-red-500 focus:ring-red-500"
              th:aria-invalid="${#fields.hasErrors(field)} ? 'true' : null"
              th:aria-describedby="${#fields.hasErrors(field)} ? ${field} + '-error' : null"
              class="w-full rounded-lg border border-gray-300 px-4 py-2 focus:border-primary-500 focus:ring-primary-500"></textarea>
    <p th:if="${#fields.hasErrors(field)}" th:id="${field} + '-error'"
       class="mt-1 text-sm text-red-600" th:errors="*{__${field}__}"></p>
</div>


<!--
  Select sobre una colección. valueProp/labelProp son nombres de propiedad
  y se resuelven por preprocesamiento (item.__${valueProp}__ -> item.id),
  no por indexado tipo item['id'], que en SpEL no es fiable sobre POJOs.

  El preprocesamiento admite cadenas de propiedades y llamadas: users pasa
  labelProp='name.name()' para mostrar el nombre del enum del rol.

  Solo hace listas planas. El select de unidad de medida de ingredients agrupa
  con <optgroup> y por eso quedó escrito a mano en su plantilla.
-->
<div th:fragment="select(field, label, required, items, valueProp, labelProp, emptyLabel)">
    <label th:for="${field}" class="mb-1 block text-sm font-medium text-gray-700">
        <span th:text="${label}">Etiqueta</span>
        <span th:if="${required}" class="text-red-500" aria-hidden="true">*</span>
    </label>
    <select th:id="${field}" th:field="*{__${field}__}" th:required="${required}"
            th:errorclass="border-red-500 focus:border-red-500 focus:ring-red-500"
            th:aria-invalid="${#fields.hasErrors(field)} ? 'true' : null"
            th:aria-describedby="${#fields.hasErrors(field)} ? ${field} + '-error' : null"
            class="w-full rounded-lg border border-gray-300 bg-white px-4 py-2 focus:border-primary-500 focus:ring-primary-500">
        <option th:if="${emptyLabel}" value="" th:text="${emptyLabel}"></option>
        <option th:each="item : ${items}"
                th:value="${item.__${valueProp}__}"
                th:text="${item.__${labelProp}__}"></option>
    </select>
    <p th:if="${#fields.hasErrors(field)}" th:id="${field} + '-error'"
       class="mt-1 text-sm text-red-600" th:errors="*{__${field}__}"></p>
</div>


<!--
  Checkbox booleano.

  NO lleva un <input type="hidden" name="..." value="false"> manual.
  th:field ya emite su propio marcador _campo para el caso desmarcado; el
  hidden extra que había en sections/create.html y sections/edit.html —hoy
  fusionadas en sections/form.html— agregaba un SEGUNDO parámetro con el mismo
  nombre, así que al tildar la casilla se enviaban visible=false y visible=true
  y el binder se quedaba con el primero: la sección nunca se hacía visible.
  Acá el bug no puede reaparecer.
-->
<div th:fragment="checkbox(field, label, hint)">
    <span class="mb-1 block text-sm font-medium text-gray-700" th:text="${label}">Etiqueta</span>
    <div class="mt-2 flex items-center gap-2">
        <input type="checkbox" th:id="${field}" th:field="*{__${field}__}"
               class="h-4 w-4 rounded border-gray-300 text-primary-600 focus:ring-primary-500">
        <label th:for="${field}" class="text-sm text-gray-700" th:text="${hint}">Activar</label>
    </div>
</div>


<!-- ---------- Estructura ---------- -->

<div th:fragment="actions(submitLabel, cancelUrl)" class="flex items-center gap-4 pt-4">
    <button th:replace="~{fragments/buttons :: submit(${submitLabel}, 'primary')}"></button>
    <a th:href="@{${cancelUrl}}"
       class="rounded-lg bg-gray-100 px-6 py-2 text-gray-700 transition-colors hover:bg-gray-200 focus:outline-none focus:ring-2 focus:ring-gray-400 focus:ring-offset-2">
        Cancelar
    </a>
</div>


<!--
  ---------- Campos de filtro de los listados ----------

  Estos NO traen su propio <form>: lo pone el llamador.

  La versión anterior sí lo traía, y eso la volvía inservible justo donde más
  falta hacía. sales/list tiene tres filtros (producto + desde + hasta) que
  viajan en un mismo <form>, y los formularios no se pueden anidar: no había
  forma de usar el fragment ahí. Quien quiera solo una búsqueda envuelve con
  toolbar :: listBar, que es el que aporta el <form>.

  El id también era fijo (id="search", con un <label for="search"> escrito a
  mano). Ahora se parametriza, así que dos campos pueden convivir en una misma
  página sin pisarse los ids ni robarse la etiqueta.
-->

<!--
  Búsqueda: etiqueta en sr-only —visible para lectores de pantalla, invisible
  en pantalla, que es lo que pide el diseño— y lupa decorativa.
-->
<div th:fragment="searchField(id, name, placeholder, value)" class="relative w-full max-w-md">
    <label th:for="${id}" class="sr-only" th:text="${placeholder}">Buscar</label>
    <input type="search" th:id="${id}" th:name="${name}" th:value="${value}" th:placeholder="${placeholder}"
           class="w-full rounded-lg border border-gray-300 py-2 pl-10 pr-4 focus:border-primary-500 focus:ring-primary-500">
    <span class="pointer-events-none absolute left-3 top-1/2 -translate-y-1/2 text-gray-400">
        <svg th:replace="~{fragments/icons :: icon('search', 'w-5 h-5')}"></svg>
    </span>
</div>


<!--
  Filtro con etiqueta visible, para las barras de varios campos.

  `type` es el del input: 'text', 'date', 'number'. Con 'date' el valor tiene
  que llegar en ISO (yyyy-MM-dd) o el navegador muestra el campo vacío;
  th:value sobre un LocalDate ya da ISO, así que pasarlo directo funciona.

  Existe sobre todo por accesibilidad: los tres filtros de sales/list tienen
  hoy un <label> sin `for`, así que no están asociados a su campo. Acá la
  asociación es por construcción y no se puede olvidar.
-->
<div th:fragment="filterField(id, name, label, type, value, placeholder)">
    <label th:for="${id}" class="mb-1 block text-xs font-medium text-gray-500" th:text="${label}">Filtro</label>
    <input th:type="${type} ?: 'text'" th:id="${id}" th:name="${name}"
           th:value="${value}" th:placeholder="${placeholder}"
           class="rounded-lg border border-gray-300 px-3 py-2 focus:border-primary-500 focus:ring-primary-500">
</div>

</body>
</html>
