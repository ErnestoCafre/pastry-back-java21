<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<!--
  Botones y acciones de fila.

  Uso:
    <a th:replace="~{fragments/buttons :: link('/tags/new', 'Nuevo Tag', 'plus', 'primary')}"></a>
    <a th:replace="~{fragments/buttons :: iconLink('/tags/1', 'eye', 'Ver tag', 'neutral')}"></a>
    <form th:replace="~{fragments/buttons :: iconDelete('/tags/1/delete',
            '¿Eliminar este tag? Se moverá a la papelera.', 'Eliminar')}"></form>

  Por qué importa normalizar `tone`:
    el mismo "editar" era hover:text-amber-600 en tags, hover:text-blue-600
    en users y text-blue-600 fijo en recipe. Acá el color lo decide la
    semántica de la acción, no el archivo donde caiga.

  Valores de `tone` (cualquier otro cae en la primera opción de cada lista):
    link, submit  -> secondary (por defecto) | primary | danger | ghost
    iconLink      -> neutral   (por defecto) | edit | danger | info
    pill          -> safe      (por defecto) | danger

  Confirmación de borrado — data-confirm, no onsubmit inline:
    un único listener delegado en /js/admin.js lee data-confirm. Ventajas
    sobre el onsubmit="return confirm('...')" que había en 15 archivos:
      - Thymeleaf escapa el atributo solo, sin escapeJavaScript a mano;
      - cambiar confirm() por un <dialog> accesible pasa a ser un cambio
        de un solo archivo;
      - es un paso hacia poder aplicar una CSP sin 'unsafe-inline'. Ojo:
        todavía NO alcanza. Quedan 9 plantillas con JS inline: ocho fichas
        de detalle y sublistados con manejadores en atributos (onclick,
        onsubmit) y sales/create con un bloque <script> propio. Tampoco hay
        ninguna cabecera CSP configurada todavía.

  Accesibilidad:
    - Los botones de solo icono llevan title Y <span class="sr-only">.
      title solo no alcanza: no todos los lectores lo anuncian y no existe
      en navegación táctil.
    - Anillo de foco visible en todos. Antes casi no había estilos :focus.
-->

<body>

<!-- ---------- Botones de acción principales ---------- -->

<a th:fragment="link(url, label, icon, tone)" th:href="@{${url}}"
   th:class="'inline-flex items-center gap-2 rounded-lg px-4 py-2 transition-colors focus:outline-none focus:ring-2 focus:ring-offset-2 ' +
             (${tone} == 'primary' ? 'bg-primary-600 text-white hover:bg-primary-700 focus:ring-primary-500' :
             (${tone} == 'danger'  ? 'bg-red-600 text-white hover:bg-red-700 focus:ring-red-500' :
             (${tone} == 'ghost'   ? 'text-gray-700 hover:bg-gray-100 focus:ring-gray-400' :
                                     'border border-gray-300 bg-white text-gray-700 hover:bg-gray-50 focus:ring-gray-400')))">
    <!--/* El th:if va en un envoltorio y NO junto al th:replace.

           Estaba mal desde que se escribió el fragment: con los dos en el mismo
           <svg>, th:replace (precedencia 100) gana sobre th:if (300) y la
           condición nunca se evalúa. El resultado era que un link sin icono
           igual llamaba a icons :: icon(null), que cae en el caso por defecto
           y dibuja el triángulo de "icono desconocido". El botón Limpiar de
           sales/list se veía así. */-->
    <th:block th:if="${icon}">
        <svg th:replace="~{fragments/icons :: icon(${icon}, 'w-5 h-5')}"></svg>
    </th:block>
    <span th:text="${label}">Acción</span>
</a>


<button th:fragment="submit(label, tone)" type="submit"
        th:class="'inline-flex items-center gap-2 rounded-lg px-6 py-2 transition-colors focus:outline-none focus:ring-2 focus:ring-offset-2 ' +
                  (${tone} == 'danger' ? 'bg-red-600 text-white hover:bg-red-700 focus:ring-red-500' :
                                         'bg-primary-600 text-white hover:bg-primary-700 focus:ring-primary-500')"
        th:text="${label}">Guardar</button>


<!-- ---------- Acciones de fila (solo icono) ---------- -->

<a th:fragment="iconLink(url, icon, label, tone)" th:href="@{${url}}" th:title="${label}"
   th:class="'inline-flex rounded-lg p-2 text-gray-500 transition-colors focus:outline-none focus:ring-2 focus:ring-offset-1 ' +
             (${tone} == 'edit'   ? 'hover:bg-amber-50 hover:text-amber-600 focus:ring-amber-500' :
             (${tone} == 'danger' ? 'hover:bg-red-50 hover:text-red-600 focus:ring-red-500' :
             (${tone} == 'info'   ? 'hover:bg-indigo-50 hover:text-indigo-600 focus:ring-indigo-500' :
                                    'hover:bg-gray-100 hover:text-primary-600 focus:ring-primary-500')))">
    <svg th:replace="~{fragments/icons :: icon(${icon}, 'w-5 h-5')}"></svg>
    <span class="sr-only" th:text="${label}">Acción</span>
</a>


<!--
  Acción POST de solo icono. `message` puede ser null: las acciones que no
  destruyen nada no confirman.

  Los tonos son los mismos que iconLink, para que la misma semántica se vea
  igual sea un enlace o un envío.
-->
<form th:fragment="iconSubmit(action, icon, label, tone, message)" th:action="@{${action}}" method="post"
      class="inline" th:data-confirm="${message}">
    <button type="submit" th:title="${label}"
            th:class="'inline-flex rounded-lg p-2 text-gray-500 transition-colors focus:outline-none focus:ring-2 focus:ring-offset-1 ' +
                      (${tone} == 'edit'    ? 'hover:bg-amber-50 hover:text-amber-600 focus:ring-amber-500' :
                      (${tone} == 'danger'  ? 'hover:bg-red-50 hover:text-red-600 focus:ring-red-500' :
                      (${tone} == 'info'    ? 'hover:bg-indigo-50 hover:text-indigo-600 focus:ring-indigo-500' :
                      (${tone} == 'success' ? 'hover:bg-green-50 hover:text-green-600 focus:ring-green-500' :
                                              'hover:bg-gray-100 hover:text-primary-600 focus:ring-primary-500'))))">
        <svg th:replace="~{fragments/icons :: icon(${icon}, 'w-5 h-5')}"></svg>
        <span class="sr-only" th:text="${label}">Acción</span>
    </button>
</form>


<!-- Borrado: el caso más común de iconSubmit, con nombre propio porque se
     repite en todos los listados y conviene que no se pueda escribir mal. -->
<form th:fragment="iconDelete(action, message, label)"
      th:replace="~{:: iconSubmit(${action}, 'trash', ${label}, 'danger', ${message})}"></form>


<!-- ---------- Acciones con etiqueta, para papeleras y footers ---------- -->

<!-- message puede ser null: acciones no destructivas como "Restaurar" no confirman. -->
<form th:fragment="pill(action, message, label, icon, tone)" th:action="@{${action}}" method="post"
      class="inline" th:data-confirm="${message}">
    <button type="submit"
            th:class="'inline-flex items-center gap-1.5 rounded-lg px-3 py-1.5 text-sm font-medium transition-colors focus:outline-none focus:ring-2 focus:ring-offset-1 ' +
                      (${tone} == 'danger' ? 'bg-red-100 text-red-700 hover:bg-red-200 focus:ring-red-500' :
                                             'bg-green-100 text-green-700 hover:bg-green-200 focus:ring-green-500')">
        <svg th:replace="~{fragments/icons :: icon(${icon}, 'w-4 h-4')}"></svg>
        <span th:text="${label}">Acción</span>
    </button>
</form>

</body>
</html>
