<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<!--
  Ítems del sidebar.

  Uso:
    <li th:replace="~{fragments/nav :: item('products', '/products', 'box', 'Productos', ${activeNav})}"></li>
    <li th:replace="~{fragments/nav :: group('Inventario')}"></li>

  `key` es el primer segmento de la URL de la sección, que es lo que publica
  ActiveNavInterceptor. Antes cada ítem repetía una condición de ~4 literales
  sobre pageTitle; ver el javadoc de ese interceptor para el detalle de qué
  estaba roto.

  aria-current="page" en el ítem activo: hasta ahora el estado activo era
  solo color, invisible para lectores de pantalla (0 aria-current en todo el
  proyecto).
-->

<body>

<li th:fragment="item(key, url, icon, label, active)">
    <a th:href="@{${url}}"
       th:aria-current="${key == active} ? 'page' : null"
       th:class="'flex items-center gap-3 rounded-lg px-4 py-3 font-medium transition-all focus:outline-none focus:ring-2 focus:ring-white/40 ' +
                 (${key == active} ? 'bg-white/20 text-white'
                                   : 'text-white/80 hover:bg-white/10 hover:text-white')">
        <svg th:replace="~{fragments/icons :: icon(${icon}, 'w-5 h-5')}"></svg>
        <span th:text="${label}">Sección</span>
    </a>
</li>


<li th:fragment="group(label)" class="mt-3 border-t border-white/10 pt-3">
    <span class="mb-1 block px-4 text-xs font-semibold uppercase tracking-wider text-white/50"
          th:text="${label}">Grupo</span>
</li>

</body>
</html>
